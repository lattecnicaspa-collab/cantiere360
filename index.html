const eurDot=v=>(Math.round(v*100)/100).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
function secTotal(sec,items){if(!sec.money)return 0;return(items||[]).reduce((s2,it)=>s2+num(it[sec.money[0]])*num(it[sec.money[1]]),0)}
function mReports(bid,mk){const T=MTYPES[mk];return boardReports(bid).filter(r=>r.mtype===mk||(!r.mtype&&T.legacy.includes(r.type||REP_TYPES[0])))}
function secItems(r,k){return(r.sec&&r.sec[k])||[]}
function secCount(r,s,rid){if(s.kind==="photo")return Object.values(S.photos).filter(p=>p.reportId===rid&&p.sec===s.k).length;if(s.kind==="pdf")return(r.attach||[]).length;if(s.kind==="sign")return(r.signs||[]).length;return secItems(r,s.k).length}

/* ---------- impaginazione ---------- */
function mTop(back,title,act){return`<div class="mtop"><button class="mback" data-mback="${esc(back||"__back")}" aria-label="Indietro">${sic("back",22)}</button><span class="mtt">${title||""}</span>${act||""}</div>`}
const mPill=(id,label)=>`<button class="mpill" id="${id}">${label}</button>`;
function mTabbar(){const t=UI.mpage==="archivio"?"archivio":UI.mpage==="galleria"?"galleria":"home";
  return`<nav class="mtab">${[["home","Home"],["archivio","Archivio"],["galleria","Galleria"]].map(([k,l])=>`<button data-mtab="${k}" class="${t===k?"on":""}">${sic(k,20)}<span>${l}</span></button>`).join("")}</nav>`}
function mHTML(){
  if((UI.mpage==="detail"||UI.mpage==="section")&&S.reports[UI.rid]&&S.boards[S.reports[UI.rid].boardId]&&UI.cur!==S.reports[UI.rid].boardId)setCur(S.reports[UI.rid].boardId);
  const bid=curBoard();UI.boardId=bid;watchPhotos(bid);
  const p=UI.mpage||"home";let h="";
  if(S.slow)h+='<div class="warnbar" style="margin-top:10px">Non riesco ancora a raggiungere i dati: quello che vedi potrebbe non essere aggiornato.</div>';
  if(p==="home")h+=mHome(bid);
  else if(p==="avvisi")h+=mAvvisi();
  else if(!bid)h+=mTop("home","")+'<div class="mcard mempty">Crea prima un cantiere dalla Home.</div>';
  else if(["giornale","sopralluogo","cse","sal","ddt","presenze","scadenzario","planimetria","imprese"].includes(p)&&!modOn(p))h+=mTop("home","")+'<div class="mcard mempty">Questa funzione è disattivata. Puoi riattivarla da Impostazioni.</div>';
  else if(MTYPES[p])h+=mList(bid,p);
  else if(p==="detail")h+=mDetail();
  else if(p==="section")h+=mSection();
  else if(p==="ddt")h+=mDdt(bid);
  else if(p==="planimetria")h+=mPlan(bid);
  else if(p==="avvisi")h+=mAvvisi();
  else if(p==="imprese")h+=mImprese();
  else if(p==="presenze")h+=mTop("home","")+lateCompaniesOnSite(bid,UI.presDate||todayISO()).map(x=>`<div class="warnbar" style="margin-bottom:10px;background:#FFEBEE;color:#B3261E;border-color:#F3B7B1"><b>${esc(x.c.name)}</b> ha documenti scaduti (${esc((x.c.docs||[]).filter(d=>docState(d.expiry)==="late").map(d=>d.type).join(", "))}) e oggi in cantiere ci sono: ${esc(x.people.join(", "))}.</div>`).join("")+`<div class="mlisthead">${chip("presenze",44)}<h1 class="mh1" style="margin:0">Presenze</h1></div>`+presHTML(S.boards[bid]);
  else if(p==="scadenzario")h+=mScad();
  else if(p==="archivio")h+=mArch(bid);
  else if(p==="galleria")h+=mGall(bid);
  return`<div class="mwrap">${h}</div>`+mTabbar();
}
function mHome(bid){
  const b=bid&&S.boards[bid];const nm=(ME.name||"").split(" ")[0];
  const open=b&&modOn("presenze")?namesOnDate(bid,todayISO()).filter(n=>hoursOn(bid,n,todayISO()).open).length:0;const sc=(modOn("scadenzario")?expiringPDocs().length:0)+(modOn("imprese")?expiringCDocs().length:0);
  const mods=MODULES.filter(([k,,,,nt])=>modOn(k)&&!nt);
  return`<div class="mhomehead"><div><div class="mhello">${nm?"Ciao "+esc(nm):"Ciao"}</div><h1 class="mh1" style="margin:0">Home</h1></div><span class="grow"></span>
   <button class="mround" id="mBell" aria-label="Avvisi" style="position:relative">${sic("bell",22)}${(()=>{const n=dlCount();return n?`<span class="mbadge">${n>99?"99+":n}</span>`:""})()}</button><button class="mround" id="mSet" aria-label="Impostazioni">${sic("gear",22)}</button><button class="mround" id="mCant" aria-label="Cambia cantiere">${sic("swap",22)}</button></div>
  ${b?`<button class="mbanner" id="mCant2"><span class="grow" style="min-width:0"><span class="mbk">Cantiere attivo</span><span class="mbn">${esc(b.name)}</span><span class="mbs">${[(b.info||{}).cliente?esc(b.info.cliente):"",open?open+" in cantiere ora":"",sc?sc+" scadenze vicine":""].filter(Boolean).join(" · ")||"Tocca per cambiare cantiere"}</span></span>${sic("chev",22)}</button>
   <div class="mtiles">${mods.map(([k,l,ic])=>`<button class="mtile" data-mgo="${k}">${chip(ic,48)}<b>${l}</b></button>`).join("")}</div>
   ${mods.length?"":`<div class="mcard mempty">Tutte le funzioni sono disattivate. Riattivale da Impostazioni.</div>`}`:
   `<div class="mcard mempty"><b style="font-size:19px">Crea il primo cantiere</b><p class="muted">Giornale, verbali, rapportini e attività si organizzano per cantiere.</p>${CANWRITE?'<button class="mpill" id="mNewB">Nuovo cantiere</button>':""}</div>`}`;
}
function settingsSheet(){
  const m=Object.assign({},S.settings.modules||{});const ro=!CANWRITE||(window.C360_ADMIN&&!C360_ADMIN());
  const draw=()=>`<div class="sheetbar"><span></span><b>Impostazioni</b><button class="mpill light" data-close>Fine</button></div>
   <div class="mlabel">Funzioni attive</div><div class="mcard msecs">${MODULES.map(([k,l,ic,d])=>`<label class="mrow mswrow">${chip(ic,38)}<span class="grow"><span class="mst">${l}</span><span class="msd">${d}</span></span><input type="checkbox" class="mswitch" data-mod="${k}" ${m[k]!==false?"checked":""} ${ro?"disabled":""} aria-label="${l}"></label>`).join("")}</div>
   <div class="msmall">${ro?"Solo l'amministratore può attivare o disattivare le funzioni.":"Le funzioni disattivate spariscono dalla Home e dalle viste per tutti. I dati già inseriti restano salvati."}</div>
   <div class="mlabel">Altro</div><div class="mcard msecs">${[["stCo","Dati azienda e logo"],["stImp","Importa da Trello, MyAEDES o Excel"],["stAll","Tutti i cantieri e cartelle"],["stOut","Esci dall'account"+(window.C360_EMAIL?" ("+esc(C360_EMAIL())+")":"")]].map(([id,l])=>`<div class="mrow" id="${id}"><span class="grow">${l}</span>${sic("chev",18,"#A3AFBF")}</div>`).join("")}</div>`;
  modal(draw(),"sheet",root=>{
    root.querySelectorAll("[data-mod]").forEach(x=>x.onchange=()=>{const cur=Object.assign({},S.settings.modules||{});cur[x.dataset.mod]=x.checked;put("settings","modules",cur)});
    const on=(id,fn)=>{const e=root.querySelector("#"+id);if(e)e.onclick=()=>{closeModal();fn()}};
    on("stCo",()=>{if(CANWRITE)companyDlg();else toast("Sola lettura")});on("stImp",()=>{if(CANWRITE)importDlg();else toast("Sola lettura")});on("stAll",()=>go("cantieri"));on("stOut",()=>{if(window.C360_LOGOUT)C360_LOGOUT()});
  });
}
function mList(bid,mk){
  const T=MTYPES[mk];const reps=mReports(bid,mk);
  const ic={giornale:"giornale",sopralluogo:"sopralluogo",cse:"cse",sal:"sal"}[mk];
  return mTop("home","",CANWRITE?mPill("mNew","+ Nuovo"):"")+`<div class="mlisthead">${chip(ic,44)}<h1 class="mh1" style="margin:0">${T.title}</h1></div>
  ${reps.length?`<div class="mlist">${reps.map(r=>{const sub=mk==="giornale"||mk==="sal"?(r.info&&r.info.meteo)||(r.weather&&r.weather.cond)||"":(r.info&&r.info.luogo)||"";
    return`<div class="mitem" data-mrep="${r.id}"><div class="grow" style="min-width:0"><div class="mdate">${!r.date?"Senza data":new Date(r.date+"T00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>${sub?`<div class="msub">${esc(sub)}</div>`:""}</div><button class="mgear" data-mgear="${r.id}" aria-label="Opzioni">${sic("dots",24)}</button></div>`}).join("")}</div>`:
  `<div class="mempty2">Non ci sono documenti da visualizzare<br>Premi «Nuovo» per compilarne uno</div>`}`;
}
function mInfoField(r,[k,l,t]){
  let v=(r.info||{})[k];if(k==="data")v=r.date;
  const ro=!CANWRITE?"readonly":"";
  const inp=t==="date"?`<input type="date" class="minp" data-minfo="${k}" value="${esc(v||"")}" ${ro}>`:t==="time"?`<input type="time" class="minp" data-minfo="${k}" value="${esc(v||"")}" ${ro}>`:
    t==="meteo"?`<input class="minp" data-minfo="${k}" list="mMeteoL" value="${esc(v||"")}" placeholder="Es. Sereno, 16 °C, vento debole" ${ro}>`:`<input class="minp" data-minfo="${k}" value="${esc(v||"")}" ${ro}>`;
  const auto=t==="meteo"&&!ro&&r.status!=="firmato"&&modOn("meteo")?` <button class="mlink" data-meteoauto type="button">${sic("sun",14)} Automatico</button>`:"";
  return`<div class="minfo"${t==="meteo"?' style="grid-column:1/-1"':""}><label>${l}${auto}</label>${inp}</div>`;
}
function mDetail(){
  const r=S.reports[UI.rid];if(!r||!MTYPES[r.mtype])return mTop("home","")+'<div class="mcard mempty">Documento non trovato.</div>';
  const T=MTYPES[r.mtype];const back=r.mtype;
  const tot=T.sections.filter(s=>s.money).reduce((a,s)=>a+secTotal(s,secItems(r,s.k)),0);
  const dlong=!r.date?"Senza data":new Date(r.date+"T00:00").toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
  return`<div class="mtop">${`<button class="mback" data-mback="${esc(back)}" aria-label="Indietro">${sic("back",22)}</button>`}<div class="grow" style="min-width:0"><div class="mhello">${esc(T.type)}${r.number?" n. "+esc(r.number):""}</div><div class="mdt">${dlong}</div></div></div>
  <div class="mcard minfogrid">${T.info.map(f=>mInfoField(r,f)).join("")}</div>
  <datalist id="mMeteoL">${WEATHER.map(w=>`<option>${w}</option>`).join("")}</datalist>
  <div class="mcard msecs">${T.sections.map(s=>{const ic=SEC_ICON[s.k]||"nota";const t=TINTS[ic]||TINTS.bacheca;const it=secItems(r,s.k);const n=secCount(r,s,UI.rid);
    const sub=s.money?(it.length?it.length+(it.length===1?" voce":" voci"):"Nessuna voce"):(n?n+(s.kind==="sign"?(n===1?" firma":" firme"):s.kind==="photo"?(n===1?" foto":" foto"):s.kind==="pdf"?" allegati":(n===1?" voce":" voci")):"Vuoto");
    return`<div class="mrow" data-msec="${s.k}">${chip(ic,38)}<span class="grow"><span class="mst">${s.l}</span><span class="msd">${sub}</span></span>${s.money?`<span class="mval" style="color:${t[1]}">${eurDot(secTotal(s,it))}</span>`:""}${sic("chev",18,"#A3AFBF")}</div>`}).join("")}</div>
  <div class="mcard mfoot">${T.sections.some(s=>s.money)?`<span class="grow"><span class="msd">Totale</span><span class="mtot">${eurDot(tot)}</span></span>`:`<span class="grow msd">Pronto per l'invio</span>`}<button class="mcta" id="mPdf">${sic("pdf",20,"#fff")}Genera PDF</button></div>`;
}
function itemSummary(s,it){
  const f=s.f;const main=it[f[0][0]]||"";const rest=f.slice(1).map(([k,l,t])=>it[k]?(t==="date"?fmtD(it[k]):it[k])+(k==="hours"?" h":k==="rate"||k==="price"?" €":""):"").filter(Boolean).join(" · ");
  return{main,rest}}
function mSection(){
  const r=S.reports[UI.rid];if(!r||!MTYPES[r.mtype])return mTop("home","")+'<div class="mcard mempty">Documento non trovato.</div>';
  const T=MTYPES[r.mtype];const s=T.sections.find(x=>x.k===UI.sec);if(!s)return mTop("r-"+UI.rid,"");
  const back="r-"+UI.rid;const ro=!CANWRITE;
  if(s.kind==="photo"){const ph=Object.entries(S.photos).filter(([,p])=>p.reportId===UI.rid&&p.sec===s.k);
    return mTop(back,"")+`<h1 class="mh1">${s.l}</h1>${ro?"":`<div class="mbtnrow"><label class="mpill">📷 Scatta<input type="file" accept="image/*" capture="environment" id="msCam" hidden></label><label class="mpill light">🖼 Galleria<input type="file" accept="image/*" multiple id="msGal" hidden></label><button class="mpill light" id="msScan">📄 Scansiona</button></div>`}
    <div class="mcard"><div class="thumbs">${ph.map(([pid,p])=>photoThumb(pid,p,ro)).join("")||'<span class="muted">Nessuna foto</span>'}</div></div>`}
  if(s.kind==="pdf"){const at=(r.attach||[]);
    return mTop(back,"")+`<h1 class="mh1">${s.l}</h1>${ro?"":`<div class="mbtnrow"><button class="mpill" id="msPScan">📄 Scansiona</button><label class="mpill light">⬆ Carica PDF<input type="file" accept="application/pdf,image/*" multiple id="msPUp" hidden></label><button class="mpill light" id="msPArch">Dall'Archivio</button></div>`}
    <div class="mlist">${at.map((did,i)=>{const d=S.docs[did];return`<div class="mitem"><div class="grow" data-mdoc="${did}" style="cursor:pointer"><div class="mdate" style="font-size:17px">📄 ${esc(d?d.name:"Documento non disponibile")}</div><div class="msub">${d?esc(d.category||""):""}</div></div>${ro?"":`<button class="ib s d" data-matdel="${i}">Togli</button>`}</div>`}).join("")||'<div class="mempty2">Nessun PDF allegato</div>'}</div>`}

    root.querySelectorAll("[data-ddx]").forEach(x=>x.onclick=()=>{grab();rows.splice(+x.dataset.ddx,1);root.innerHTML=draw();bind(root)});

/* ---------- PDF dei documenti a sezioni ---------- */
async function pdfM(rid){
  const r=S.reports[rid];if(!r)return;const T=MTYPES[r.mtype];const b=S.boards[r.boardId]||{};const i=b.info||{};
  if(!DL){toast("Il download non è disponibile in questa vista");return}
  let jsPDF;try{jsPDF=await ensurePdfLib()}catch(e){toast("Impossibile caricare il generatore PDF");return}
  toast("Preparo il PDF…");
  try{
    const doc=new jsPDF({unit:"mm",format:"a4"});const W=210,M=14;let y=M;
    const need=h=>{if(y+h>285-M){doc.addPage();y=M}};
    const text=(t,size,bold,rgb)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size||10);rgb?doc.setTextColor(rgb[0],rgb[1],rgb[2]):doc.setTextColor(25);for(const ln of doc.splitTextToSize(String(t||""),W-2*M)){need((size||10)*.45);doc.text(ln,M,y);y+=(size||10)*.45}};
    const table=(head,body,foot)=>{if(!body.length)return;if(doc.autoTable){doc.autoTable({startY:y,head:[head],body,foot:foot?[foot]:undefined,margin:{left:M,right:M},styles:{fontSize:9,cellPadding:1.6},headStyles:{fillColor:[91,123,163]},footStyles:{fillColor:[235,240,247],textColor:20,fontStyle:"bold"},theme:"grid"});y=doc.lastAutoTable.finalY+4}else{body.forEach(rw=>text(rw.join(" | "),9));y+=2}};
    const sect=t=>{y+=2;need(12);doc.setDrawColor(91,123,163);doc.line(M,y,W-M,y);y+=5;text(t,11.5,true,[91,123,163]);y+=1};
    const co=company();if(co.logo||co.name){if(co.logo){try{const lh=12,lw=Math.min(50,lh*(co.logoW||3)/(co.logoH||1));doc.addImage(co.logo,"JPEG",M,y-4,lw,lh)}catch(_){}}doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(30);doc.text(co.name||"",W-M,y,{align:"right"});doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(100);if(co.addr)doc.text(doc.splitTextToSize(co.addr,110),W-M,y+4,{align:"right"});y+=12;doc.setDrawColor(200);doc.line(M,y-2,W-M,y-2);y+=3}
    text(T.type.toUpperCase(),16,true,[91,123,163]);text("del "+fmtD(r.date),11,true);y+=1;
    text("Cantiere: "+(b.name||""),10);[["Cliente",i.cliente],["Indirizzo",i.indirizzo],["Committente",i.committente],["Direttore lavori",i.direttore],["Resp. sicurezza / CSE",i.sicurezza]].forEach(([a,v])=>{if(v)text(a+": "+v,9)});
    const inf=T.info.filter(f=>f[0]!=="data").map(([k,l,t])=>[l,(r.info||{})[k]||""]).filter(x=>x[1]);
    if(inf.length){y+=2;table(["Informazione","Valore"],inf)}
    for(const s of T.sections){
      if(s.kind==="photo"){const ph=Object.values(S.photos).filter(p=>p.reportId===rid&&p.sec===s.k&&p.type==="image");if(!ph.length)continue;sect(s.l);let x=M,rowH=0;const cw=(W-2*M-6)/2;
        for(const p of ph){const d=await imgData(p);if(!d)continue;const ratio=(p.h||3)/(p.w||4);const h=Math.min(cw*ratio,85);const w=h/ratio;if(x+w>W-M+.1){x=M;y+=rowH+2;rowH=0}if(y+h+8>285-M){doc.addPage();y=M;x=M;rowH=0}
          try{doc.addImage(d,"JPEG",x,y,w,h)}catch(_){}const cap=[p.caption||"",co.stamp!==false&&p.at?new Date(p.at).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}):""].filter(Boolean).join(" · ");if(cap){doc.setFontSize(8);doc.setTextColor(90);doc.text(doc.splitTextToSize(cap,w)[0],x,y+h+3.5)}rowH=Math.max(rowH,h+5);x+=cw+6}
        y+=rowH+2;continue}
      if(s.kind==="pdf"){const at=(r.attach||[]).map(d=>S.docs[d]).filter(Boolean);if(!at.length)continue;sect(s.l);at.forEach(d=>text("• "+d.name+" (allegato in fondo)",9.5));continue}
      if(s.kind==="sign"){const sg=r.signs||[];sect("Firme");if(!sg.length){need(30);doc.setDrawColor(150);doc.line(M,y+18,M+70,y+18);doc.line(W/2+2,y+18,W/2+72,y+18);y+=26;continue}
        for(let k=0;k<sg.length;k+=2){need(34);[sg[k],sg[k+1]].forEach((x,j)=>{if(!x)return;const xx=j?W/2+2:M;try{doc.addImage(x.img,"PNG",xx,y,60,20)}catch(_){}doc.setFontSize(9);doc.setTextColor(40);doc.text((x.name||"")+(x.at?"  "+new Date(x.at).toLocaleDateString("it-IT"):""),xx,y+25)});y+=32}continue}
      const items=secItems(r,s.k);if(!items.length)continue;sect(s.l);
      if(s.f.length===1||(s.f[0][2]==="area"&&s.f.length<=2&&!s.money&&s.k!=="prescrizioni"&&s.k!=="rilevazioni")){items.forEach(it=>{text("• "+(it[s.f[0][0]]||""),10);y+=1});continue}
      const head=s.f.map(f=>f[1]);const body=items.map(it=>s.f.map(([k,,t])=>{const v=it[k]||"";return t==="date"?fmtD(v):t==="num"?String(v).replace(".",","):v}));
      if(s.money){head.push("Importo €");body.forEach((row,j)=>row.push(eurDot(num(items[j][s.money[0]])*num(items[j][s.money[1]])).replace(" €","")));
        const foot=s.f.map(()=>"");foot[foot.length-1]="Totale";foot.push(eurDot(secTotal(s,items)).replace(" €",""));table(head,body,foot)}else table(head,body)}
    // pagine scansionate degli allegati
    for(const did of(r.attach||[])){const pg=docPages(did);for(const [,p] of pg){const d=await imgData(p);if(!d)continue;const land=(p.w||1)>(p.h||1);doc.addPage("a4",land?"l":"p");const PW=land?297:210,PH=land?210:297;const k=Math.min((PW-12)/(p.w||1),(PH-12)/(p.h||1));try{doc.addImage(d,"JPEG",(PW-(p.w||1)*k)/2,(PH-(p.h||1)*k)/2,(p.w||1)*k,(p.h||1)*k)}catch(_){}}}
    const n=doc.getNumberOfPages();for(let q=1;q<=n;q++){doc.setPage(q);doc.setFontSize(8);doc.setTextColor(120);const pw=doc.internal.pageSize.getWidth(),ph2=doc.internal.pageSize.getHeight();doc.text(T.type+" "+fmtD(r.date)+" – pagina "+q+" di "+n,pw-M,ph2-5,{align:"right"})}
    let out=doc.output("arraybuffer");
    const pdfFiles=(r.attach||[]).map(d=>S.docs[d]).filter(d=>d&&d.assetId&&/pdf/i.test(d.mime||d.name||""));
    if(pdfFiles.length){try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js");const {PDFDocument}=window.PDFLib;const main=await PDFDocument.load(out);
      for(const d of pdfFiles){try{const bytes=await (await fetch(window.C360A?await C360A.url(d.assetId):photoSrc({assetId:d.assetId}))).arrayBuffer();const src=await PDFDocument.load(bytes,{ignoreEncryption:true});const cp=await main.copyPages(src,src.getPageIndices());cp.forEach(pg=>main.addPage(pg))}catch(_){toast("Allegato non unito: "+d.name)}}
      out=await main.save()}catch(_){toast("Allegati PDF non uniti: scaricali dall'Archivio")}}
    if(await saveFile(safeName(T.type+"_"+fmtD(r.date))+".pdf",new Blob([out],{type:"application/pdf"})))toast("PDF pronto");
  }catch(e){toast("Errore PDF: "+(e&&e.message||e))}
}

async function fileToCanvas(file,max){
  if(/\.pdf$/i.test(file.name)||file.type==="application/pdf"){const r=await pdfToCanvases(file,1);return r.pages[0]}
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
  finally{URL.revokeObjectURL(url)}
}

async function issuesPdf(bid,only){
  const b=S.boards[bid];const list=boardIssues(bid).filter(x=>!only||only.includes(x.id));if(!list.length)return;toast("Preparo il PDF…");
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js")}catch(_){}
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
    doc.setFontSize(16);doc.text("Segnalazioni – "+(b.name||""),14,16);doc.setFontSize(10);doc.setTextColor(110);doc.text("Aggiornato al "+fmtD(todayISO())+" · "+(company().name||""),14,22);doc.setTextColor(0);
    let y=28;
    for(const [pid,p] of boardPlans(bid)){const pins=list.filter(x=>x.planId===pid&&x.x!=null);if(!pins.length)continue;
      const src=await imgData(p);if(!src)continue;const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});if(!img)continue;
      const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext("2d");x.drawImage(img,0,0);const rad=Math.max(12,c.width/70);
      pins.forEach(q=>{const s=issueSt(q.status);x.fillStyle=s[2];x.beginPath();x.arc(q.x*c.width,q.y*c.height,rad,0,7);x.fill();x.fillStyle="#fff";x.font=`bold ${Math.round(rad*1.1)}px sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillText(String(q.n),q.x*c.width,q.y*c.height)});
      const w=182,h=Math.min(240,w*c.height/c.width),ww=h*c.width/c.height;if(y+h>285){doc.addPage();y=14}
      doc.setFontSize(11);doc.text(p.caption||"Pianta",14,y);y+=3;doc.addImage(c.toDataURL("image/jpeg",.8),"JPEG",14,y,ww,h);y+=h+6}
    if(y>200){doc.addPage();y=14}
    doc.autoTable({startY:y,head:[["N.","Segnalazione","Stato","Impresa","Entro","Note"]],body:list.map(x=>[x.n,x.title||"",issueSt(x.status)[1],x.impresa||"",x.due?fmtD(x.due):"",x.note||""]),styles:{fontSize:9},headStyles:{fillColor:[36,87,197]}});
    for(const x of list){const ph=(x.photos||[]).filter(pid=>S.photos[pid]);if(!ph.length)continue;doc.addPage();doc.setFontSize(12);doc.text(`N. ${x.n} – ${x.title||""}`,14,16);let yy=22,xx=14;
      for(const pid of ph){const d=await imgData(S.photos[pid]);if(!d)continue;const p=S.photos[pid];const w=88,h=Math.min(110,w*(p.h||3)/(p.w||4));if(yy+h>285){doc.addPage();yy=14;xx=14}doc.addImage(d,"JPEG",xx,yy,w,h);if(xx>14){xx=14;yy+=h+4}else xx=108}}
    const fn=list.length===1?`Segnalazione_${list[0].n}_${safeName(list[0].title)}.pdf`:"Segnalazioni_"+safeName(b.name)+(only?"_"+list.map(x=>x.n).join("-"):"")+".pdf";
    if(await saveFile(fn,doc.output("blob")))toast("PDF pronto");
  }catch(e){toast("PDF non riuscito: "+(e&&e.message||""))}
}

/* ================= meteo automatico (Open-Meteo, gratuito) ================= */
const WMO={0:"Sereno",1:"Prevalentemente sereno",2:"Parzialmente nuvoloso",3:"Coperto",45:"Nebbia",48:"Nebbia",51:"Pioviggine",53:"Pioviggine",55:"Pioviggine",56:"Pioviggine gelata",57:"Pioviggine gelata",61:"Pioggia debole",63:"Pioggia",65:"Pioggia forte",66:"Pioggia gelata",67:"Pioggia gelata",71:"Neve debole",73:"Neve",75:"Neve forte",77:"Neve",80:"Rovesci",81:"Rovesci",82:"Rovesci forti",85:"Rovesci di neve",86:"Rovesci di neve",95:"Temporale",96:"Temporale con grandine",99:"Temporale con grandine"};
async function siteCoords(bid){
  const b=S.boards[bid];const i=(b&&b.info)||{};
  if(i.lat!=null&&i.lon!=null&&i.geoFor===(i.indirizzo||""))return{lat:i.lat,lon:i.lon};
  const tries=[];const a=(i.indirizzo||"").trim();
  if(a){tries.push(a);const parts=a.split(/[,\-–]/).map(s=>s.replace(/\b\d{5}\b/g,"").replace(/\([A-Z]{2}\)/g,"").trim()).filter(Boolean);for(let k=parts.length-1;k>=0;k--)tries.push(parts[k]);
    const words=a.replace(/[\d,()]/g," ").split(/\s+/).filter(w=>w.length>3);if(words.length)tries.push(words.slice(-2).join(" "),words[words.length-1])}
  for(const q of [...new Set(tries)]){try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=it&country=IT&name="+encodeURIComponent(q));const j=await r.json();
    if(j&&j.results&&j.results[0]){const g=j.results[0];const nb=clone(S.boards[bid]);nb.info=Object.assign({},nb.info,{lat:g.latitude,lon:g.longitude,geoFor:a,geoName:g.name});if(CANWRITE)put("boards",bid,nb);return{lat:g.latitude,lon:g.longitude}}}catch(_){}}
  if(navigator.geolocation){try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:3600e3}));return{lat:p.coords.latitude,lon:p.coords.longitude,fromDevice:true}}catch(_){}}
  return null;
}
async function weatherFor(bid,date){
  const c=await siteCoords(bid);if(!c)throw new Error("posizione del cantiere sconosciuta: scrivi l'indirizzo nei dati del cantiere");
  const old=daysBetween(date,todayISO())>80;
  const base=old?"https://archive-api.open-meteo.com/v1/archive":"https://api.open-meteo.com/v1/forecast";
  const r=await fetch(`${base}?latitude=${c.lat}&longitude=${c.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=Europe%2FRome&start_date=${date}&end_date=${date}`);
  if(!r.ok)throw new Error("servizio meteo non raggiungibile");const j=await r.json();const d=j.daily||{};
  if(!d.time||!d.time.length||d.weather_code[0]==null)throw new Error("dati meteo non disponibili per questa data");
  const parts=[WMO[d.weather_code[0]]||"Variabile",`${Math.round(d.temperature_2m_min[0])}–${Math.round(d.temperature_2m_max[0])} °C`];
  if(d.precipitation_sum[0]>=0.5)parts.push(`pioggia ${String(Math.round(d.precipitation_sum[0]*10)/10).replace(".",",")} mm`);
  if(d.wind_speed_10m_max[0]>=30)parts.push(`vento fino a ${Math.round(d.wind_speed_10m_max[0])} km/h`);
  return parts.join(", ");
}
async function autoMeteo(rid,force){
  const r=S.reports[rid];if(!r||!modOn("meteo")||r.status==="firmato")return;if(!force&&r.info&&r.info.meteo)return;
  const T=MTYPES[r.mtype];if(!T||!T.info.some(f=>f[0]==="meteo"))return;
  try{const txt=await weatherFor(r.boardId,r.date||todayISO());const rr=clone(S.reports[rid]);rr.info=rr.info||{};rr.info.meteo=txt;put("reports",rid,rr);
    const inp=document.querySelector('[data-minfo="meteo"]');if(inp)inp.value=txt;if(force)toast("Meteo aggiornato")}
  catch(e){if(force)toast("Meteo: "+(e&&e.message||"non disponibile"))}
}

/* ================= avvisi e scadenze ================= */
function allDeadlines(){
  const out=[];const t=todayISO();
  const st=d=>{const dd=daysBetween(t,d);return dd<0?"late":dd<=7?"week":dd<=30?"soon":""};
  dueList().forEach(c=>{const d=c.due.slice(0,10);out.push({id:"c:"+c.id,kind:"Attività",label:c.title,sub:(S.boards[c.boardId]||{}).name||"",date:d,st:st(d),open:()=>{go("b-"+c.boardId);setTimeout(()=>openCard(c.id),60)}})});
  if(modOn("scadenzario"))personList().forEach(p=>(p.docs||[]).forEach((d,i)=>{if(!d.expiry)return;const s=st(d.expiry);if(s)out.push({id:"p:"+p.id+":"+i,kind:"Personale",label:d.type,sub:p.name,date:d.expiry,st:s,open:()=>scadSheet(p.id,i)})}));
  if(modOn("imprese"))companyList().forEach(c=>(c.docs||[]).forEach((d,i)=>{if(!d.expiry)return;const s=st(d.expiry);if(s)out.push({id:"i:"+c.id+":"+i,kind:"Aziende",label:d.type,sub:c.name,date:d.expiry,st:s,open:()=>companySheet(c.id)})}));
  if(modOn("planimetria"))Object.entries(S.issues).forEach(([id,x])=>{if(!x.due||x.status==="chiusa")return;const s=st(x.due);if(s)out.push({id:"s:"+id,kind:"Segnalazioni",label:"N. "+x.n+" – "+(x.title||""),sub:(S.boards[x.boardId]||{}).name||"",date:x.due,st:s,open:()=>{setCur(x.boardId);go("m-planimetria");setTimeout(()=>issueSheet(id),80)}})});
  return out.sort((a,b2)=>a.date.localeCompare(b2.date));
}

    ${ch.map(x=>`<div class="mrow"><span class="grow" style="min-width:0"><span class="mst" style="font-weight:600">${esc(x.who)} ${esc(x.txt)}</span><span class="msd">${new Date(x.at).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></span></div>`).join("")||'<div class="mrow"><span class="msd">Nessuna modifica recente</span></div>'}</div>`})():""}`;
}
function bindAvvisi(){
  document.querySelectorAll("[data-dl]").forEach(x=>x.onclick=()=>{const it=(UI._dl||[])[+x.dataset.dl];if(it)it.open()});
  const ac=$("#avChg");if(ac)ac.onchange=()=>{C360_CHG_TOGGLE(ac.checked);toast(ac.checked?"Ti avviserò delle modifiche":"Avvisi delle modifiche spenti")};
  const p=$("#avPerm");if(p)p.onclick=async()=>{try{const r=await Notification.requestPermission();if(r==="granted"){toast("Notifiche attivate");checkDeadlines(true)}else toast("Notifiche non consentite")}catch(_){toast("Questo browser non supporta le notifiche")}render()};
}
function dlCount(){return allDeadlines().filter(x=>x.st==="late"||x.st==="week").length}
let DL_T=null;
function checkDeadlines(force){
  if(!S.ready)return;const l=allDeadlines().filter(x=>x.st==="late"||x.st==="week");if(!l.length)return;
  const day=todayISO();let seen={};try{seen=JSON.parse(localStorage.getItem("c360_avvisi")||"{}")}catch(_){}
  if(seen.day!==day)seen={day,ids:[],popup:false};
  const fresh=l.filter(x=>!seen.ids.includes(x.id));
  if(fresh.length&&window.C360_NOTIFY&&("Notification" in window)&&Notification.permission==="granted"){
    const late=fresh.filter(x=>x.st==="late").length;
    C360_NOTIFY(fresh.length===1?fresh[0].label+" – "+DL_LBL[fresh[0].st]:`${fresh.length} scadenze${late?" ("+late+" già scadute)":""}`,fresh.slice(0,4).map(x=>`${fmtD(x.date)} · ${x.label}${x.sub?" ("+x.sub+")":""}`).join("\n"),"scadenze-"+day);
  }
  if((!seen.popup||force)&&!MSTACK.length&&UI.view==="m"&&(UI.mpage||"home")==="home"){seen.popup=true;deadlinePopup(l)}
  seen.ids=[...new Set(seen.ids.concat(fresh.map(x=>x.id)))];try{localStorage.setItem("c360_avvisi",JSON.stringify(seen))}catch(_){}
}
function deadlinePopup(l){
  const late=l.filter(x=>x.st==="late").length;
  modal(`<div class="sheetbar"><span></span><b>Scadenze</b><button class="mpill light" data-close>Chiudi</button></div>
   <div class="msd" style="margin:0 6px 10px">${late?`<b style="color:#B3261E">${late} già scadute</b> · `:""}${l.length-late} nei prossimi 7 giorni</div>
   <div class="mcard msecs">${l.slice(0,6).map((x,i)=>`<div class="mrow" data-pdl="${i}"><span class="grow" style="min-width:0"><span class="mst">${esc(x.label)}</span><span class="msd">${esc(x.kind)}${x.sub?" · "+esc(x.sub):""}</span></span><span class="chip ${x.st==="late"?"late":"soon"}">${fmtD(x.date)}</span></div>`).join("")}</div>
   <button class="mbig" id="pdlAll" style="background:#2457C5">Vedi tutti gli avvisi</button>`,"sheet",root=>{
    root.querySelectorAll("[data-pdl]").forEach(x=>x.onclick=()=>{closeModal();l[+x.dataset.pdl].open()});
    root.querySelector("#pdlAll").onclick=()=>{closeModal();go("m-avvisi")}});
}

/* ---------- modali ---------- */
const MSTACK=[];
function modal(html,size,bind,stack){
  if(!stack)closeModal(true,true);
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="md ${size||""}"><button class="x" data-close>×</button>${html}</div>`;
  $("#ovRoot").appendChild(ov);MSTACK.push(ov);
  const md=ov.firstElementChild;
  ov.addEventListener("pointerdown",e=>{ov._down=e.target===ov});
  ov.addEventListener("click",e=>{if(e.target===ov&&ov._down)closeModal()});
  md.addEventListener("click",e=>{if(e.target.closest("[data-close]")){e.preventDefault();closeModal()}});
  if(bind)bind(md);
  document.body.style.overflow="hidden";
  return md;
}
function flushFocus(){const a=document.activeElement;if(a&&a!==document.body&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))a.blur()}
function closeModal(one,all){
  flushFocus();
  if(all){while(MSTACK.length)MSTACK.pop().remove()}
  else{const m=MSTACK.pop();if(m)m.remove();
    const top=MSTACK[MSTACK.length-1];if(top&&top.firstElementChild._reb)top.firstElementChild._reb()}
  if(!MSTACK.length)document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&MSTACK.length)closeModal()});
function confirmDlg(msg,ok,stack){modal(`<h3>Conferma</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="ib" data-close>Annulla</button><button class="ib p" id="cfOk">Conferma</button></div>`,"sm",r=>r.querySelector("#cfOk").onclick=()=>{closeModal(true);ok()},stack!==false)}
function inputDlg(title,val,ok,stack){modal(`<h3>${esc(title)}</h3><input class="i" id="idV" value="${esc(val||"")}"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="ib" data-close>Annulla</button><button class="ib p" id="idOk">OK</button></div>`,"sm",r=>{const i=r.querySelector("#idV");i.focus();i.select();const go2=()=>{const v=i.value.trim();if(!v)return;closeModal(true);ok(v)};r.querySelector("#idOk").onclick=go2;i.onkeydown=e=>{if(e.key==="Enter")go2()}},!!stack)}

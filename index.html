*{box-sizing:border-box}

.tshell header,.tshell nav.tabs{display:none!important}
.tshell main{padding:0 0 96px}

.tshell .list{min-width:0}
.tshell .lbody,.tshell .lfoot,.tshell .lhead{min-width:0}
.ttop:not(.dark) #tLogo rect[fill="#fff"]{fill:#44546f}.ttop:not(.dark) #tLogo rect:not([fill="#fff"]){fill:#fff}
.lcount{color:#44546f;font-size:16px;margin:0 6px}

.tshell .lfoot{display:flex;align-items:center;gap:2px;padding:4px 8px 10px}
.laddc{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px;border-radius:8px;font-size:17px;color:#44546f;cursor:pointer;text-align:left}

.tbot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #dcdfe4;display:flex;align-items:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tbot button{border:0;background:none;color:#172b4d;padding:10px 14px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}

.tsep{width:1px;height:36px;background:#dcdfe4;margin:0 4px}
.tbot button:first-child+button{margin-right:auto}
.md.tpop{max-width:460px;padding:8px}
.md.tpop>.x{display:none}
.tmenu{display:flex;flex-direction:column}
.tmhead{text-align:center;font-weight:700;padding:8px 0 6px}

.tmenu button:hover,.tmenu button.on{background:#e9f2ff}
.tmenu b{display:block;font-size:17px;font-weight:500}
.tmenu small{display:block;color:#626f86;font-size:14px;margin-top:2px;line-height:1.35}
.tmi{flex:0 0 28px;display:flex;justify-content:center;color:#44546f}
.tpage{padding:12px 14px}
.tinboxbg{background:linear-gradient(#eef4ff,#dbe8ff);min-height:calc(100vh - 150px)}
.tph{display:flex;align-items:center;gap:10px;font-size:22px;color:#172b4d;margin:4px 0 14px}
.tadd{width:100%;border:1px solid #c7d1db;border-radius:12px;padding:14px 16px;font-size:17px;background:#fff;box-shadow:0 1px 2px rgba(9,30,66,.15)}
.tcards{margin-top:12px}
.tempty{text-align:center;margin:50px 10px;color:#172b4d}.tempty b{font-size:21px}.tempty p{color:#44546f;line-height:1.5}
.tlock{text-align:center;color:#44546f;margin:30px 0 10px}
.trow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tmon{display:inline-flex;align-items:center;gap:6px;font-size:20px;color:#172b4d;position:relative;cursor:pointer}
.tmon input{position:absolute;inset:0;opacity:0}
.tbtn{border:1px solid #c7d1db;background:#fff;border-radius:10px;padding:8px 14px;font-size:17px;color:#44546f;cursor:pointer}
.tday{padding:12px 2px;border-bottom:1px solid #f1f2f4}
.tdh{display:flex;align-items:center;gap:8px;font-size:19px;color:#44546f}.tdh b{color:#172b4d}
.tnone{color:#626f86;font-size:17px;margin-top:8px}
.tblock{display:flex;align-items:center;gap:10px;background:#e9f2ff;border-radius:10px;padding:10px;margin-top:8px;cursor:pointer}
.tblock.due{background:#fff7d6}
.tblock small{display:block;color:#626f86}
.ttime{font-weight:600;font-size:14px;white-space:nowrap}
.tsearch{display:flex;align-items:center;gap:8px;border:2px solid #388bff;border-radius:12px;padding:8px 12px;color:#44546f}
.tsearch input{border:0;outline:none;font-size:18px;flex:1;background:none}
.tchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tchips button{border:1px solid #c7d1db;background:#fff;border-radius:8px;padding:6px 12px;font-size:16px;color:#44546f;cursor:pointer}
.tchips button.on{border-color:#388bff;background:#e9f2ff;color:#0c66e4}
.tsec{font-weight:700;color:#44546f;font-size:17px;margin:14px 0 8px}
.ttiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ttile{border:1px solid #dcdfe4;border-radius:10px;overflow:hidden;background:#fff;padding:0;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(9,30,66,.15)}
.ttile .ttg{display:block;height:80px}
.ttile .ttn{display:block;padding:10px 12px;font-size:16px;color:#172b4d}
.ttile.new{margin-top:14px;width:100%;background:#f1f2f4}
.mshell main{padding:0 16px 120px;max-width:780px;margin:0 auto}
.mwrap{padding-top:calc(env(safe-area-inset-top) + 6px)}
.mname{text-align:center;font-size:22px;margin:12px 0 14px;min-height:26px}
.mhomehead{display:flex;align-items:center;justify-content:space-between}
.mh1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:6px 0 16px;line-height:1.15}
.mh2{font-size:22px;font-weight:700;margin:8px 4px 8px}
.mcantbtn{width:58px;height:58px;border-radius:50%;border:2.5px solid #5b7ba3;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.mcantname{border:0;background:none;color:#5b7ba3;font-weight:600;padding:0;margin:2px 0 16px;font-size:15px;text-align:left}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(min-width:700px){.mtiles{grid-template-columns:repeat(3,1fr)}}
.mtile{background:#fff;border:2.5px solid #5b7ba3;border-radius:16px;padding:20px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:180px;justify-content:center;color:#111;cursor:pointer}
.mtile b{font-size:18px;text-align:center}.mtile span{font-size:14px}
.mtile.alt{border-color:#c5d0de}
.mtop{display:flex;align-items:center;gap:12px;min-height:64px;margin-top:4px}
.mpill.sm{font-size:16px;padding:10px 16px}
.mtt{flex:1;font-size:21px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mshell .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.mback{width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid #d1d1d6;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#111;padding:0;flex:0 0 auto}
.mpill{background:#3b82f6;color:#fff;border:0;border-radius:28px;padding:12px 22px;font-size:19px;font-weight:600;box-shadow:0 2px 6px rgba(59,130,246,.35);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.mpill.light{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.12);border:1px solid #e5e5ea;font-size:16px;padding:9px 16px}
.mpill:disabled{opacity:.5}
.mlist{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.mitem{background:#fff;border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px;cursor:pointer}
.mitem .grow{min-width:0;overflow-wrap:anywhere}
.mdate{font-size:20px}
.msub{font-style:italic;color:#333;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.mtext{font-size:17px;white-space:pre-wrap;word-break:break-word;max-height:4.6em;overflow:hidden}
.mgear{border:0;background:none;padding:4px;flex:0 0 auto}
.mcard{background:#fff;border-radius:16px;padding:8px 18px;margin-bottom:14px}
.minfogrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;padding:12px 18px}
.minfo label{display:block;color:#8e8e93;font-size:15px;margin-top:6px}
.minp{width:100%;border:0;background:transparent;font-style:italic;font-size:17px;padding:4px 0;color:#111}
.minp:focus{outline:none;background:#f2f6fc;border-radius:6px}
.msecs{padding:0 18px}
.mrow{display:flex;align-items:center;gap:10px;min-height:64px;border-bottom:1px solid #e5e5ea;font-size:18px;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mval{color:#5b7ba3;font-size:18px;white-space:nowrap}
.mchev{color:#c7c7cc;font-size:30px;line-height:1}
.mbig{display:block;margin:16px auto 10px;background:#e35d4a;color:#fff;border:0;border-radius:32px;padding:16px 40px;font-size:22px;font-weight:600;min-width:60%;cursor:pointer}
.mtab{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(247,247,247,.97);border-top:1px solid #ddd;display:flex;justify-content:center;gap:24px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.mtab button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:13px;color:#111;padding:6px 22px;border-radius:26px;cursor:pointer}
.mtab button.on{background:#e3e3e8;color:#5b7ba3}
.mempty2{text-align:center;color:#111;font-size:18px;margin:60px 10px;line-height:1.5}
.mempty{text-align:center;padding:24px;font-size:17px}
.mbtnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mlabel{color:#8e8e93;font-size:15px;margin:12px 6px 6px}
.mform .mfrow{padding:10px 0;border-bottom:1px solid #e5e5ea}.mform .mfrow:last-child{border-bottom:0}
.mfrow label{display:block;color:#8e8e93;font-size:14px}
.mfrow textarea.minp{font-style:normal;border:1px solid #e5e5ea;border-radius:8px;padding:8px;min-height:110px}
.mfrow select.minp{font-style:normal}
.md.sheet{max-width:640px;background:#f2f2f7;border-radius:22px}
.md.sheet>.x{display:none}
.sheetbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheetbar b{font-size:18px;text-align:center}
.mgall{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mgall img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer}
@media(max-width:380px){.mtile{min-height:160px}.mtile b{font-size:16px}.mpill{font-size:17px;padding:11px 18px}}
body{font-family:'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.mshell{--bg:#EEF1F5;--ink:#14213D;--mut:#5B6B82;--line:#E3E8EF;--acc:#2457C5;--acc2:#E8F0FF;background:#EEF1F5;color:#14213D}
.mshell .mwrap{padding-top:calc(env(safe-area-inset-top) + 14px)}

.mbanner{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:20px;background:#2457C5;color:#fff;padding:16px 18px;margin-bottom:16px;cursor:pointer;font:inherit}
.mbk{display:block;font-size:13px;opacity:.85;font-weight:600}.mbn{display:block;font-size:19px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mbs{display:block;font-size:13px;opacity:.9}
.mshell .mtiles{gap:12px}
.mshell .mtile{border:0;border-radius:20px;background:#fff;box-shadow:0 1px 0 #E3E8EF;min-height:0;padding:16px;align-items:flex-start;justify-content:flex-start;gap:14px;font:inherit;color:#14213D}

.mdt{font-size:22px;font-weight:800;letter-spacing:-.3px}
.mshell .mpill{background:#2457C5;box-shadow:none;border-radius:14px;font-size:16px;padding:11px 16px;font-weight:700}

.mlisthead{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.mshell .mitem{border-radius:20px;box-shadow:0 1px 0 #E3E8EF;padding:16px 16px}
.mshell .mdate{font-size:17px;font-weight:700;text-transform:capitalize}
.mshell .msub{font-style:normal;color:#5B6B82;font-size:14px}
.mshell .mgear{color:#5B6B82}
.mshell .mcard{border-radius:20px;box-shadow:0 1px 0 #E3E8EF}
.mshell .minfogrid{padding:12px 16px}
.mshell .minfo label{font-size:13px;font-weight:600;color:#5B6B82}

.md.sheet{background:#EEF1F5}

.mbig[disabled]{opacity:.5}
.cdoc{padding:10px 4px;border-bottom:1px solid #EEF1F5}
.mlink{border:0;background:#E8F0FF;color:#2457C5;font:inherit;font-weight:700;font-size:12px;padding:3px 8px;border-radius:8px;margin-left:6px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;vertical-align:middle}
/* bacheca con la stessa grafica delle altre pagine */
body.tshell,body.tshell.tgrad{background:#EEF1F5!important;color:#14213D;font-family:'Manrope',system-ui,-apple-system,sans-serif}
body.tshell .ttop,body.tshell .ttop.dark{background:#EEF1F5;border:0;color:#14213D;padding:calc(env(safe-area-inset-top) + 12px) 16px 6px;gap:8px}
body.tshell .ttop .tic{color:#14213D}
body.tshell #tBack{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 1px 0 #E3E8EF}
body.tshell #tLogo rect[fill="#fff"]{fill:#2457C5}body.tshell #tLogo rect:not([fill="#fff"]){fill:#fff}
body.tshell .tcrea{background:#2457C5;box-shadow:none;border-radius:14px;font-weight:700;font-size:16px;padding:10px 16px}
body.tshell .thead,body.tshell.tgrad .thead{background:transparent;color:#14213D;border:0;padding:6px 16px 10px}
body.tshell .tname{font-size:24px;font-weight:800;letter-spacing:-.4px}
body.tshell .tview{background:#fff;color:#2457C5;border-radius:12px;box-shadow:0 1px 0 #E3E8EF;padding:7px 10px}
body.tshell .thead .tic{background:#fff;border-radius:12px;box-shadow:0 1px 0 #E3E8EF;color:#14213D}
body.tshell .board{padding:4px 16px 24px;gap:12px}
body.tshell .list{background:#fff;border-radius:20px;box-shadow:0 1px 0 #E3E8EF}
body.tshell .lname{font-size:16px;font-weight:800;color:#14213D}
body.tshell .lcount{color:#5B6B82;font-size:14px}
body.tshell .kc{background:#F4F6F9;border-radius:14px;box-shadow:none;border:1px solid #E9EDF2;color:#14213D}
body.tshell .kc:hover{border-color:#C9D6EE}
body.tshell .laddc{color:#2457C5;font-weight:700;font-size:15px}
body.tshell .list.addl{background:rgba(36,87,197,.08);box-shadow:none}
body.tshell .laddl{color:#2457C5;font-weight:700}
body.tshell .tbot{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));border:0;border-radius:22px;box-shadow:0 4px 18px rgba(20,33,61,.10);padding:8px}
body.tshell .tbot button{color:#5B6B82;border-radius:16px}
body.tshell .tbot button.on{background:#E8F0FF;color:#2457C5}
body.tshell .tbot button.on::after{display:none}
body.tshell .tsep{background:#E3E8EF}
body.tshell .tvw{padding:4px 16px 0}
body.tshell .tvw .box,body.tshell .tvw .tw{border-radius:20px;box-shadow:0 1px 0 #E3E8EF;border:0;background:#fff}
body.tshell .filt input,body.tshell .filt select,body.tshell .filt .ib{border-radius:12px;border-color:#E3E8EF;background:#fff}
body.tshell .ib.p{background:#2457C5;border-color:#2457C5}
body.tshell #main>*:not(.ttop):not(.thead):not(.board):not(.tbot):not(.tvw):not(script){margin-left:12px;margin-right:12px}
.mbadge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#B3261E;color:#fff;font:800 11px/20px Manrope,system-ui,sans-serif;box-sizing:border-box}
.msmall{font-size:13px;color:#5B6B82;margin:-6px 6px 10px}

html,body{margin:0;height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px}
header .brand{font-weight:700;color:var(--acc);white-space:nowrap;cursor:pointer}
header .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;min-height:36px}
.ib.p{background:var(--acc);border-color:var(--acc);color:#fff}
.ib.d{color:var(--bad)}
.ib.s{padding:3px 8px;min-height:28px;font-size:13px}
.ib:disabled{opacity:.5;cursor:default}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;padding:0 5px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:19}
nav.tabs button{border:0;background:none;padding:6px 12px;border-radius:20px;white-space:nowrap;color:var(--mut)}
nav.tabs button.on{background:var(--acc2);color:var(--acc);font-weight:600}
main{padding:12px}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.bcard{border-radius:var(--r);padding:14px;color:#fff;min-height:96px;cursor:pointer;position:relative;box-shadow:var(--sh)}
.bcard h3{margin:0 0 4px;font-size:16px}
.bcard .star{position:absolute;right:10px;top:8px;background:none;border:0;color:#fff;font-size:18px}
h2{font-size:18px;margin:16px 0 8px}
/* bacheca */
.board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:20px;min-height:60vh}
.list{flex:0 0 280px;background:#e9edf2;border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
@media (prefers-color-scheme:dark){.list{background:#161b22}}
.list.collapsed{flex-basis:44px}
.list.collapsed .lbody,.list.collapsed .lfoot,.list.collapsed .lname{display:none}
.lhead{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;border-top:4px solid transparent;border-radius:var(--r) var(--r) 0 0}
.lname{flex:1;font-weight:600;border:0;background:transparent;padding:4px;border-radius:6px;min-width:0}
.lname:focus{background:var(--card)}
.lbody{overflow-y:auto;padding:4px 8px;min-height:24px;flex:1}
.lfoot{padding:6px 8px 8px}
.kc{background:var(--card);border-radius:8px;padding:8px 10px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;user-select:none;-webkit-user-select:none;border:1px solid transparent}
.kc:hover{border-color:var(--acc)}
.kc.done .kt{text-decoration:line-through;color:var(--mut)}
.kc .kt{word-break:break-word}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.lab{height:8px;min-width:36px;border-radius:4px}
.labt{font-size:12px;padding:2px 8px;border-radius:4px;color:#fff;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;background:var(--acc2)}
.chip.late{background:var(--bad);color:#fff}.chip.soon{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}
.av{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;align-items:center;justify-content:center;font-weight:600}
.ghost{position:fixed;pointer-events:none;z-index:100;opacity:.9;transform:rotate(3deg);width:260px}
.ph{height:40px;border:2px dashed var(--acc);border-radius:8px;margin-bottom:8px}
/* modale */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 8px}
.md{background:var(--card);border-radius:12px;width:100%;max-width:760px;padding:16px;position:relative}
.md.sm{max-width:420px}
.md h3{margin:0 0 12px;font-size:18px;padding-right:36px}
.x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:22px;color:var(--mut)}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px}
textarea.i{min-height:80px;resize:vertical}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.cols{grid-template-columns:1fr}}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.sec>h4{margin:0 0 8px;font-size:15px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0}
.ck input[type=checkbox]{width:20px;height:20px}
.ck .t{flex:1}
.ck.d .t{text-decoration:line-through;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.cm{background:var(--bg);border-radius:8px;padding:8px;margin:6px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:110px}
.thumb img{width:110px;height:82px;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
.thumb input{width:110px;font-size:12px;margin-top:2px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;background:var(--card)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.ed td{padding:3px}
table.ed input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--card)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dh{font-size:12px;color:var(--mut);text-align:center;padding:4px}
.cal .d{background:var(--card);min-height:84px;padding:4px;border-radius:6px;font-size:12px;overflow:hidden}
.cal .d.o{opacity:.45}.cal .d.today{outline:2px solid var(--acc)}
.cal .ev{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:1px 4px;margin-top:2px;background:var(--acc2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.r{background:#dff3e6;color:#185c33}
@media (max-width:600px){.cal .d{min-height:56px}.cal .ev{font-size:10px}}
/* timeline */
.tl{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow-x:auto}
.tlr{display:flex;align-items:center;border-bottom:1px solid var(--line);height:34px}
.tln{flex:0 0 160px;padding:0 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.tlb{position:absolute;height:20px;border-radius:4px;background:var(--acc);color:#fff;font-size:11px;padding:2px 6px;white-space:nowrap;overflow:hidden;cursor:pointer}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:26px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hb .n{flex:0 0 130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{flex:1;height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--acc)}
/* rapportini */
.rp{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.rp:last-child{border-bottom:0}
.rp .grow{min-width:0}
@media (max-width:600px){.rp{flex-wrap:wrap}.rp .grow{flex-basis:calc(100% - 100px)}}
.st{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--acc2);color:var(--acc)}
.st.f{background:#dff3e6;color:#185c33}
canvas.sig{width:100%;height:150px;border:1px dashed var(--mut);border-radius:8px;touch-action:none;background:#fff}
.sigimg{max-width:260px;max-height:110px;background:#fff;border:1px solid var(--line);border-radius:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:200;max-width:90vw}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filt input,.filt select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.warnbar{background:#fff4e5;color:#7a4b00;border:1px solid #f3d19e;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:8px}
.menu button:hover{background:var(--acc2)}
.sw{display:inline-block;width:28px;height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
</style>
</head>

    doc(id){return{
      async set(data){const at=new Date().toISOString();let error;try{({error}=await sb.from("kv").upsert({owner:UID,col,id,data,updated_at:at},{onConflict:"col,id"}))}catch(e){error=e}
        if(error){if(isNet(error)){qAdd({col,id,data,at});return}throw mkErr(error)}},

function noteChange(p){

  const byWho={};uniq.forEach(x=>(byWho[x.who]=byWho[x.who]||[]).push(x));

function mkDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  const finals=new Set(),states=new Set();let rec=null,want=false,pend="",endWait=null;
  const setState=st=>{states.forEach(f=>{try{f({state:st})}catch(_){}})};
  const emit=t=>{t=(t||"").trim();if(t)finals.forEach(f=>{try{f({text:" "+t})}catch(_){}})};
  const mkErr=c=>{const e=new Error(c);e.code=c;return e};
  function boot(lang,resolve,reject){
    rec=new SR();rec.lang=lang;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;pend="";
    rec.onstart=()=>{setState("listening");if(resolve){resolve();resolve=null}};
    rec.onresult=ev=>{let interim="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];const t=r[0]&&r[0].transcript||"";if(r.isFinal)emit(t);else interim+=t}pend=interim};
    rec.onerror=ev=>{const c=ev.error;
      if(c==="not-allowed"||c==="service-not-allowed"){want=false;if(reject){reject(mkErr("not_granted"));reject=null}else{try{toast("Microfono non autorizzato")}catch(_){}}}
      else if(c==="network"||c==="audio-capture"||c==="language-not-supported"){want=false;if(reject){reject(mkErr("unavailable"));reject=null}else{try{toast("Dettatura interrotta: controlla rete e microfono")}catch(_){}}}};
    rec.onend=()=>{if(pend){emit(pend);pend=""}
      if(reject){reject(mkErr("unavailable"));reject=null;resolve=null}
      if(want){try{boot(lang)}catch(_){want=false;setState("idle")}}else{setState("idle");if(endWait){endWait();endWait=null}}};
    try{rec.start()}catch(e){want=false;if(reject){reject(mkErr("unavailable"));reject=null}}
  }
  return{
    start(o){if(want)return Promise.resolve();want=true;const l=(o&&o.language)||"it";const lang=l==="it"?"it-IT":l;
      return new Promise((res,rej)=>boot(lang,res,rej))},
    stop(){want=false;if(!rec)return Promise.resolve();setState("finishing");
      return new Promise(r=>{endWait=r;try{rec.stop()}catch(_){r()}setTimeout(()=>{if(endWait===r){endWait=null;r()}},2500)})},
    active(){return want},
    onFinal(f){finals.add(f);return()=>finals.delete(f)},
    onState(f){states.add(f);return()=>states.delete(f)}
  };
}

  if(c==="invalid_argument"){if(CANWRITE_CHECKED!==true){CANWRITE=false;toast("Non hai i permessi per modificare: sola lettura")}else toast("Salvataggio rifiutato: elemento troppo grande o non permesso")}
  else if(c==="quota_exceeded")toast("Spazio del database esaurito: elimina vecchi elementi o foto");
  else toast("Errore di salvataggio: "+(err&&err.message||c||"sconosciuto"));
}
let rT=null,rPend=false;function scheduleRender(){if(rT)return;rT=requestAnimationFrame(()=>{rT=null;if(DRAG)return;const a=document.activeElement;if(a&&a.closest&&a.closest("#main")&&/INPUT|TEXTAREA/.test(a.tagName)&&a.id!=="fq"){rPend=true;return}render()})}
document.addEventListener("focusout",()=>{if(rPend){rPend=false;setTimeout(scheduleRender,0)}});

async function init(){
  let db=null;
  try{
    if(window.claude&&window.claude.use){
      const t=new Promise(r=>setTimeout(()=>r(null),10000));
      db=await Promise.race([window.claude.use("db"),t]);
      USER=await Promise.race([window.claude.use("user"),new Promise(r=>setTimeout(()=>r(null),3000))]);
      window.claude.use("assets").then(a=>ASSETS=a).catch(()=>{});
      window.claude.use("downloads").then(d=>DL=d).catch(()=>{});
      window.claude.use("dictation").then(d=>{DICT=d;if(d)setupDict(d)}).catch(()=>{});
      window.claude.use("sample").then(async sm=>{SAMPLE=sm;if(sm){try{const l=await sm.limits();SAMPLE_IMG=!!(l&&l.images)}catch(_){}scheduleRender()}}).catch(()=>{});
    }
  }catch(e){db=null}
  if(USER){try{ME=await USER.me()}catch(e){} try{const w=await USER.can("data.write");CANWRITE_CHECKED=w;if(w===false)CANWRITE=false}catch(e){}}
  if(!db){LOCAL=true;loadLocal();S.ready=true;render();setTimeout(runOverdueRules,500);return}
  DB=db;
  let pending=["boards","cards","reports"];
  const tm=setTimeout(()=>{if(!S.ready){S.ready=true;S.slow=true;render()}},10000);
  const sub=(col,path,quiet)=>DB.collection(path).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[col]=o;
    if(!(snap.metadata&&snap.metadata.fromCache)){pending=pending.filter(x=>x!==col);if(!pending.length){clearTimeout(tm);S.slow=false}}
    if(!S.ready&&!pending.length)S.ready=true;
    if(S.ready)scheduleRender();
  },err=>{if(quiet)return;clearTimeout(tm);S.ready=true;S.err=err&&err.code;scheduleRender()});
  sub("boards","boards");sub("cards","cards");sub("reports","reports");
  ["people","punches","settings","companies"].forEach(k=>{try{sub(k,k,true)}catch(e){}});
  window._subPP=()=>{if(window._ppOn)return;window._ppOn=true;try{sub("pphotos","pphotos",true)}catch(e){}};
  setTimeout(runOverdueRules,9000);
  if(ME.id){try{sub("inbox","data/users/"+ME.id,true)}catch(e){}}
}

function route(){
  {const hh=location.hash||"#home";if(NAV[NAV.length-2]===hh)NAV.pop();else if(NAV[NAV.length-1]!==hh)NAV.push(hh);if(NAV.length>60)NAV.splice(0,NAV.length-60)}

  let mq=h.match(/^m-([a-z]+)$/);if(mq){UI.view="m";UI.mpage=mq[1];render();return}

  mq=h.match(/^r-([a-z0-9]+)$/);if(mq){UI.view="m";UI.mpage="detail";UI.rid=mq[1];render();return}
  mq=h.match(/^s-([a-z0-9]+)-([a-z]+)$/);if(mq){UI.view="m";UI.mpage="section";UI.rid=mq[1];UI.sec=mq[2];render();return}

  const tq=h.match(/^t-([a-z0-9]+)$/);if(tq){UI.presDate=null;setCur(tq[1]);UI.view="m";UI.mpage="presenze";render();return}
  const m=h.match(/^b-([a-z0-9]+)(?:-(bacheca|tabella|calendario|timeline|giornale|dashboard|documenti|presenze|costi))?$/);
  if(m&&UI.boardId!==m[1]){UI.filt={q:"",label:"",member:"",due:""};UI.jf=null}
  if(m&&S.boards[m[1]]){UI.view="board";UI.boardId=m[1];UI.tab=m[2]||"bacheca"}

}

async function deleteBoard(id){
  for(const [cid,c] of Object.entries(S.cards))if(c.boardId===id)del("cards",cid);
  for(const [rid,r] of Object.entries(S.reports))if(r.boardId===id)del("reports",rid);
  for(const [pid,p] of Object.entries(S.punches))if(p.boardId===id)del("punches",pid);
  for(const col of["photos","docs","computo"]){
    if(!LOCAL&&DB){try{const sn=await DB.collection(col).where("boardId","==",id).get();sn.docs.forEach(d=>{const x=d.data();if(x&&x.assetId&&ASSETS)ASSETS.delete(x.assetId).catch(()=>{});del(col,d.id)})}catch(e){}}
    else for(const [k,x] of Object.entries(S[col]))if(x.boardId===id)del(col,k);}
  del("boards",id);
}

function filtHTML(b,extra){
  const f=UI.filt;
  return`<div class="filt"><input id="fq" placeholder="Filtra schede…" value="${esc(f.q)}" style="flex:1;min-width:140px">
  <select id="fl"><option value="">Etichetta</option>${(b.labels||[]).map(l=>`<option value="${l.id}" ${f.label===l.id?"selected":""}>${esc(l.name)}</option>`).join("")}</select>

  <select id="fd"><option value="">Scadenza</option>${[["late","In ritardo"],["soon","Entro 2 giorni"],["week","Entro 7 giorni"],["none","Senza scadenza"],["done","Completate"],["open","Aperte"]].map(([k,l])=>`<option value="${k}" ${f.due===k?"selected":""}>${l}</option>`).join("")}</select>
  ${extra||""}</div>`;
}
function passFilt(c){
  const f=UI.filt;
  if(f.q){const s=f.q.toLowerCase();if(!((c.title||"")+" "+(c.desc||"")).toLowerCase().includes(s))return false}
  if(f.label&&!(c.labels||[]).includes(f.label))return false;
  if(f.member&&!(c.members||[]).includes(f.member))return false;
  if(f.due){const ds=dueState(c);
    if(f.due==="late"&&ds!=="late")return false;
    if(f.due==="soon"&&!(ds==="soon"))return false;
    if(f.due==="week"&&!(c.due&&!c.done&&daysBetween(todayISO(),c.due.slice(0,10))<=7))return false;
    if(f.due==="none"&&c.due)return false;
    if(f.due==="done"&&!c.done)return false;
    if(f.due==="open"&&c.done)return false;}
  return true;
}
function bindFilt(){
  const r=()=>{UI.filt={q:$("#fq").value,label:$("#fl").value,member:$("#fm").value,due:$("#fd").value};render();const i=$("#fq");if(i&&document.activeElement!==i&&UI._fqFocus){i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
  const fq=$("#fq");if(!fq)return;
  fq.oninput=()=>{UI._fqFocus=true;r()};fq.onblur=()=>{UI._fqFocus=false};
  ["#fl","#fm","#fd"].forEach(s=>$(s).onchange=r);
}

/* ---------- trascinamento schede (mouse e touch) ---------- */
let DRAG=null;
function bindDrag(el){
  el.addEventListener("click",e=>{if(el._dragged){el._dragged=false;return}openCard(el.dataset.card)});
  if(!CANWRITE)return;
  el.addEventListener("pointerdown",e=>{
    if(e.button>0)return;
    const sx=e.clientX,sy=e.clientY,touch=e.pointerType!=="mouse";let started=false,timer=null;
    const start=()=>{started=true;const r=el.getBoundingClientRect();
      const g=el.cloneNode(true);g.classList.add("ghost");g.style.left=r.left+"px";g.style.top=r.top+"px";document.body.appendChild(g);
      const ph=document.createElement("div");ph.className="ph";ph.style.height=r.height+"px";el.after(ph);el.style.display="none";
      DRAG={el,g,ph,dx:sx-r.left,dy:sy-r.top};if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}};
    if(touch)timer=setTimeout(start,280);
    const mv=ev=>{
      if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){if(touch){clearTimeout(timer);cleanup()}else start()}return}
      ev.preventDefault();DRAG.g.style.left=(ev.clientX-DRAG.dx)+"px";DRAG.g.style.top=(ev.clientY-DRAG.dy)+"px";
      const under=document.elementFromPoint(ev.clientX,ev.clientY);const lb=under&&under.closest(".list:not(.collapsed)");
      const body=lb&&lb.querySelector(".lbody");
      if(body){const kids=[...body.querySelectorAll(".kc")].filter(k=>k!==el&&k.style.display!=="none");
        let before=null;for(const k of kids){const r=k.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=k;break}}
        if(before)body.insertBefore(DRAG.ph,before);else body.appendChild(DRAG.ph)}
      const bd=$("#board");if(bd){const r=bd.getBoundingClientRect();if(ev.clientX>r.right-40)bd.scrollLeft+=12;else if(ev.clientX<r.left+40)bd.scrollLeft-=12}
      const lbd=body;if(lbd){const r=lbd.getBoundingClientRect();if(ev.clientY>r.bottom-30)lbd.scrollTop+=10;else if(ev.clientY<r.top+30)lbd.scrollTop-=10}
    };
    const tm=ev=>{if(started)ev.preventDefault()};
    const up=ev=>{clearTimeout(timer);if(started){el._dragged=true;finishDrag()}cleanup()};
    const cleanup=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);document.removeEventListener("touchmove",tm)};
    document.addEventListener("pointermove",mv,{passive:false});document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
    document.addEventListener("touchmove",tm,{passive:false});
  });
}
function finishDrag(){
  const {el,g,ph}=DRAG;const body=ph.parentElement;const lid=body&&body.dataset.drop;
  const cid=el.dataset.card;
  const sib=[...body.children].filter(k=>k.classList.contains("kc")&&k!==el&&k.style.display!=="none");
  const idx=[...body.children].filter(k=>k===ph||(k.classList.contains("kc")&&k!==el&&k.style.display!=="none")).indexOf(ph);
  g.remove();DRAG=null;
  if(!lid){render();return}
  const prev=sib[idx-1],next=sib[idx];
  const pp=prev?S.cards[prev.dataset.card].pos||0:null,np=next?S.cards[next.dataset.card].pos||0:null;
  let pos=pp==null&&np==null?1:pp==null?np-1:np==null?pp+1:(pp+np)/2;
  const c=clone(S.cards[cid]);const b=B();const from=c.listId;
  c.pos=pos;c.listId=lid;
  if(from!==lid){addAct(c,"Spostata da «"+((listOf(b,from)||{}).name||"?")+"» a «"+(listOf(b,lid)||{}).name+"»");runRules(b,c,{type:"moved",to:lid})}
  put("cards",cid,c);render();
}

/* ---------- foto e allegati ---------- */
function compressImage(file,max,qual){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
    cv.toBlob(b=>res({blob:b,w,h,dataUrl:cv.toDataURL("image/jpeg",qual)}),"image/jpeg",qual)};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});
}
async function addPhoto(file,meta){
  const isImg=/^image\//.test(file.type);
  const rec=Object.assign({name:file.name,type:isImg?"image":"file",caption:"",at:nowISO(),by:ME.id},meta);
  try{
    if(ASSETS){
      let blob=file;if(isImg){const c=await compressImage(file,1600,.8);blob=c.blob;rec.w=c.w;rec.h=c.h}
      const a=await ASSETS.upload(blob);rec.assetId=a.id;
    }else{
      if(!isImg){toast("Gli allegati non immagine richiedono permessi da editor: caricato solo il nome non è possibile");return}
      let c=await compressImage(file,1280,.7);if(c.dataUrl.length>200000)c=await compressImage(file,900,.6);if(c.dataUrl.length>200000)c=await compressImage(file,640,.55);
      rec.dataUrl=c.dataUrl;rec.w=c.w;rec.h=c.h;
    }
    const id=uid();S.photos[id]=rec;await put("photos",id,rec);
  }catch(e){toast("Caricamento non riuscito: "+(e&&e.message||e&&e.code||""))}
}
function photoSrc(p){if(p.dataUrl&&/^data:image\//.test(p.dataUrl))return p.dataUrl;if(p.assetId&&/^[\w\-.~]+$/.test(p.assetId))return window.C360A?C360A.src(p.assetId):"/_blob/"+p.assetId;return""}
function photoThumb(pid,p,ro){
  if(p.type!=="image")return`<div class="thumb"><a href="${esc(photoSrc(p))}" target="_blank" rel="noopener" class="ib s" style="display:block;height:82px;overflow:hidden">📄 ${esc(p.name)}</a>${ro?"":`<button class="ib s d" data-dp="${pid}">Elimina</button>`}</div>`;
  return`<div class="thumb"><img src="${esc(photoSrc(p))}" alt="" data-view="${pid}"><input data-cap="${pid}" value="${esc(p.caption||"")}" placeholder="Didascalia" ${ro?"readonly":""}>${ro?"":`<div class="row" style="gap:2px;margin-top:2px"><button class="ib s" data-ann="${pid}" title="Annota">✏️</button><button class="ib s d" data-dp="${pid}" style="flex:1">Elimina</button></div>`}</div>`;

/* ---------- timeline ---------- */
function timelineHTML(b){
  const cs=boardCards(UI.boardId).filter(c=>!c.template&&(c.start||c.due)).filter(passFilt);
  if(!cs.length)return filtHTML(b)+'<div class="box empty">Imposta data di inizio e/o scadenza sulle schede per vederle sulla timeline.</div>';
  const s0=cs.map(c=>(c.start||c.due).slice(0,10)).sort()[0],e0=cs.map(c=>(c.due||c.start).slice(0,10)).sort().slice(-1)[0];
  const from=new Date(s0+"T00:00");from.setDate(from.getDate()-2);const fromISO=from.getFullYear()+"-"+String(from.getMonth()+1).padStart(2,"0")+"-"+String(from.getDate()).padStart(2,"0");
  const days=Math.max(14,daysBetween(fromISO,e0)+5),W=UI.tlW||28;
  let head='<div class="tlr" style="height:28px"><div class="tln"></div><div style="position:relative;height:100%;width:'+(days*W)+'px">';
  for(let i=0;i<days;i++){const d=new Date(from);d.setDate(from.getDate()+i);head+=`<span style="position:absolute;left:${i*W}px;width:${W}px;text-align:center;font-size:10px;color:var(--mut);top:7px;${d.getDay()===0||d.getDay()===6?"background:var(--bg)":""}">${d.getDate()}${d.getDate()===1?"/"+(d.getMonth()+1):""}</span>`}
  head+="</div></div>";
  const rows=(b.lists||[]).filter(l=>!l.archived).flatMap(l=>cs.filter(c=>c.listId===l.id).sort((a,b2)=>(a.start||a.due).localeCompare(b2.start||b2.due)).map(c=>{

    const barCol=c.done?"var(--ok)":dueState(c)==="late"?"var(--bad)":(col(l.color)||"var(--acc)");

}

function dashHTML(b){

  const days=new Set(reps.filter(r=>(r.type||"Rapportino giornaliero")==="Rapportino giornaliero").map(r=>r.date)).size;

   <div class="kpi"><span class="muted small">In ritardo</span><b style="color:var(--bad)">${late.length}</b></div>
   <div class="kpi"><span class="muted small">Completate</span><b style="color:var(--ok)">${done.length}</b></div>
   <div class="kpi"><span class="muted small">Checklist</span><b>${ckT?Math.round(ckD/ckT*100):0}%</b><span class="small muted">${ckD}/${ckT} voci</span></div>
   <div class="kpi"><span class="muted small">Giorni lavorati</span><b>${days}</b></div>
   <div class="kpi"><span class="muted small">Ore manodopera</span><b>${Math.round(totH*10)/10}</b></div></div>
  <div class="grid" style="margin-top:12px">
   <div class="box"><h4 style="margin-top:0">Schede per lista</h4>${bars(byList)}</div>
   <div class="box"><h4 style="margin-top:0">Schede per etichetta</h4>${bars(byLab)}</div>
   <div class="box"><h4 style="margin-top:0">Attività aperte per scadenza</h4>${bars(byDue)}</div>
   <div class="box"><h4 style="margin-top:0">Attività aperte per persona</h4>${bars(byMem)}</div>
   <div class="box"><h4 style="margin-top:0">Ore lavorate per persona (dai rapportini)</h4>${bars(Object.entries(hours).sort((a,b2)=>b2[1]-a[1]))}</div>
  </div>
  ${late.length?`<h2>In ritardo</h2><div class="box">${late.map(c=>`<div class="rp" data-card="${c.id}"><span class="chip late">${fmtD(c.due)}</span><span class="grow">${esc(c.title)}</span><span class="muted small">${esc((listOf(b,c.listId)||{}).name||"")}</span></div>`).join("")}</div>`:""}`;
}

function newReport(type){

  const nr=same.reduce((m,r)=>Math.max(m,+r.number||0),0)+1;
  const r={boardId:UI.boardId,type,number:nr,date,createdAt:nowISO(),createdBy:ME.id,status:"bozza",
    weather:{cond:"",tmin:"",tmax:""},workers:[],equipment:[],materials:[],activities:"",problems:"",notes:"",
    safety:(b.safety||SAFETY_ITEMS).map(t=>({text:t,ok:null})),sign:{},timeFrom:"08:00",timeTo:"17:00"};
  if(type===REP_TYPES[0]&&reps.some(x=>x.date===date&&(x.type||REP_TYPES[0])===type)){

function reportText(r){

function fileToImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();img.onload=()=>{res(img)};img.onerror=()=>rej(new Error("Immagine non leggibile"));img.src=u})}
function imgToCanvas(img,max){const s=Math.min(1,(max||2400)/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
function solveH(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){const [x,y]=dst[i],[u,v]=src[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
  const n=8;
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
    const d=A[i][i];if(Math.abs(d)<1e-10)return null;
    for(let r=0;r<n;r++){if(r===i)continue;const f=A[r][i]/d;if(!f)continue;for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
  return b.map((v,i)=>v/A[i][i]);
}
function warpQuad(srcCanvas,quad,maxSide){
  const d=(a,b2)=>Math.hypot(a[0]-b2[0],a[1]-b2[1]);
  let W=Math.max(d(quad[0],quad[1]),d(quad[3],quad[2])),H=Math.max(d(quad[0],quad[3]),d(quad[1],quad[2]));
  const s=Math.min(1,(maxSide||2000)/Math.max(W,H));W=Math.max(10,Math.round(W*s));H=Math.max(10,Math.round(H*s));
  const h=solveH(quad,[[0,0],[W,0],[W,H],[0,H]]);if(!h)return null;
  const sw=srcCanvas.width,sh=srcCanvas.height,sd=srcCanvas.getContext("2d").getImageData(0,0,sw,sh).data;
  const out=document.createElement("canvas");out.width=W;out.height=H;const oc=out.getContext("2d");const od=oc.createImageData(W,H);const o=od.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const z=h[6]*x+h[7]*y+1;const u=(h[0]*x+h[1]*y+h[2])/z,v=(h[3]*x+h[4]*y+h[5])/z;
    const x0=Math.floor(u),y0=Math.floor(v);const k=(y*W+x)*4;o[k+3]=255;
    if(x0<0||y0<0||x0>=sw-1||y0>=sh-1){o[k]=o[k+1]=o[k+2]=255;continue}
    const fx=u-x0,fy=v-y0;const i00=(y0*sw+x0)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4;
    for(let c=0;c<3;c++)o[k+c]=(sd[i00+c]*(1-fx)+sd[i10+c]*fx)*(1-fy)+(sd[i01+c]*(1-fx)+sd[i11+c]*fx)*fy;
  }
  oc.putImageData(od,0,0);return out;

function filterCanvas(c,mode){
  if(mode==="orig")return c;
  const W=c.width,H=c.height;const out=document.createElement("canvas");out.width=W;out.height=H;const oc=out.getContext("2d");oc.drawImage(c,0,0);
  const id=oc.getImageData(0,0,W,H),d=id.data;const g=new Float32Array(W*H);
  for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  if(mode==="gray"){let lo=255,hi=0;for(let j=0;j<g.length;j+=5){if(g[j]<lo)lo=g[j];if(g[j]>hi)hi=g[j]}const r=Math.max(1,hi-lo);
    for(let i=0,j=0;j<g.length;i+=4,j++){const v=Math.max(0,Math.min(255,(g[j]-lo)*255/r));d[i]=d[i+1]=d[i+2]=v}}
  else{
    const I=new Float64Array((W+1)*(H+1));
    for(let y=0;y<H;y++){let s=0;for(let x=0;x<W;x++){s+=g[y*W+x];I[(y+1)*(W+1)+x+1]=I[y*(W+1)+x+1]+s}}
    const R=Math.max(8,Math.round(Math.min(W,H)/35));
    for(let y=0;y<H;y++){const y1=Math.max(0,y-R),y2=Math.min(H,y+R+1);
      for(let x=0;x<W;x++){const x1=Math.max(0,x-R),x2=Math.min(W,x+R+1);
        const m=(I[y2*(W+1)+x2]-I[y1*(W+1)+x2]-I[y2*(W+1)+x1]+I[y1*(W+1)+x1])/((x2-x1)*(y2-y1));
        const v=g[y*W+x];const o2=v>=m*0.9?255:Math.max(0,Math.min(255,(v-m*0.5)*2.4));const k=(y*W+x)*4;d[k]=d[k+1]=d[k+2]=o2}}}
  oc.putImageData(id,0,0);return out;
}
function rotateCanvas(c){const o=document.createElement("canvas");o.width=c.height;o.height=c.width;const x=o.getContext("2d");x.translate(o.width,0);x.rotate(Math.PI/2);x.drawImage(c,0,0);return o}
function autoCorners(c){
  const S2=320/Math.max(c.width,c.height);const w=Math.max(4,Math.round(c.width*S2)),h=Math.max(4,Math.round(c.height*S2));
  const t=document.createElement("canvas");t.width=w;t.height=h;const x=t.getContext("2d");x.drawImage(c,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
  const g=new Uint8Array(w*h);const hist=new Array(256).fill(0);
  for(let i=0,j=0;j<w*h;i+=4,j++){g[j]=(.299*d[i]+.587*d[i+1]+.114*d[i+2])|0;hist[g[j]]++}

  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=tot-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF;const v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
  const lab=new Int32Array(w*h);let bestId=0,bestN=0,id=0;const st=[];
  for(let p=0;p<w*h;p++){if(lab[p]||g[p]<=th)continue;id++;let n=0;st.push(p);lab[p]=id;
    while(st.length){const q2=st.pop();n++;const qx=q2%w,qy=(q2/w)|0;
      if(qx+1<w){const r=q2+1;if(!lab[r]&&g[r]>th){lab[r]=id;st.push(r)}}
      if(qx>0){const r=q2-1;if(!lab[r]&&g[r]>th){lab[r]=id;st.push(r)}}
      if(qy+1<h){const r=q2+w;if(!lab[r]&&g[r]>th){lab[r]=id;st.push(r)}}
      if(qy>0){const r=q2-w;if(!lab[r]&&g[r]>th){lab[r]=id;st.push(r)}}}
    if(n>bestN){bestN=n;bestId=id}}
  if(bestN<tot*.12||bestN>tot*.97)return null;
  let tl=[0,0,1e9],tr=[0,0,-1e9],br=[0,0,-1e9],bl=[0,0,1e9];
  for(let p=0;p<w*h;p++){if(lab[p]!==bestId)continue;const px=p%w,py=(p/w)|0;
    if(px+py<tl[2])tl=[px,py,px+py];if(px+py>br[2])br=[px,py,px+py];if(px-py>tr[2])tr=[px,py,px-py];if(px-py<bl[2])bl=[px,py,px-py]}
  return[tl,tr,br,bl].map(([px,py])=>[Math.min(c.width,Math.max(0,(px+.5)/S2)),Math.min(c.height,Math.max(0,(py+.5)/S2))]);
}

      while(du.length>200000&&guard++<20){if(qq>.5)qq-=.1;else{const s2=document.createElement("canvas");s2.width=Math.round(cc.width*.8);s2.height=Math.round(cc.height*.8);s2.getContext("2d").drawImage(cc,0,0,s2.width,s2.height);cc=s2;rec.w=s2.width;rec.h=s2.height}du=cc.toDataURL("image/jpeg",qq)}
      rec.dataUrl=du}
    const id=uid();await put(colName||"photos",id,rec);return id;
  }catch(e){toast("Salvataggio pagina non riuscito: "+(e&&(e.message||e.code)||""));return null}
}
/* scanDlg: opts {title, single, onDone(canvases[])} */
function scanDlg(opts){
  const pages=[];let src=null,quad=null,res=null,filter="doc",stage="pick",disp=null,scale=1,drag=-1;
  const draw=()=>`<h3>📄 ${esc(opts.title||"Scansione documento")}</h3>
   <div class="row"><label class="ib p">📷 Scatta foto<input type="file" accept="image/*" capture="environment" id="scCam" hidden></label>

   ${pages.length?`<div class="thumbs" style="margin-top:8px">${pages.map((p,i)=>`<div class="thumb"><img src="${p.toDataURL("image/jpeg",.5)}"><button class="ib s d" data-scdel="${i}" style="width:110px;margin-top:2px">Togli pag. ${i+1}</button></div>`).join("")}</div>`:""}
   <div id="scStage" style="margin-top:10px">${stage==="pick"?'<div class="box empty small">Scatta una foto del documento appoggiato su una superficie scura e ben illuminata, oppure scegli un\'immagine. Poi sposta i 4 angoli sul bordo del foglio.</div>':""}
   ${stage==="crop"?`<div class="small muted" style="margin-bottom:6px">Trascina i 4 cerchi sugli angoli del documento.</div><canvas id="scCv" style="width:100%;max-height:62vh;touch-action:none;border-radius:8px;background:#222;display:block"></canvas>
     <div class="row" style="margin-top:8px"><button class="ib" id="scAuto">🔍 Rileva bordi</button><button class="ib" id="scAll">Tutta la foto</button><span class="grow"></span><button class="ib" id="scCancel">Annulla</button><button class="ib p" id="scCrop">Ritaglia ✓</button></div>`:""}
   ${stage==="filter"?`<canvas id="scRes" style="width:100%;max-height:62vh;object-fit:contain;border:1px solid var(--line);border-radius:8px;display:block;background:#fff"></canvas>
     <div class="row" style="margin-top:8px">${[["doc","Documento B/N"],["gray","Grigio"],["orig","Colori"]].map(([k,l])=>`<button class="ib s" data-scf="${k}" style="${filter===k?"background:var(--acc);color:#fff":""}">${l}</button>`).join("")}<button class="ib s" id="scRot">⟳ Ruota</button><button class="ib s" id="scRecrop">✂ Rifai ritaglio</button></div>
     <div class="row" style="margin-top:8px;justify-content:flex-end">${opts.single?"":'<button class="ib" id="scMore">+ Aggiungi e scansiona altra pagina</button>'}<button class="ib p" id="scOk">${opts.single?"Usa questa scansione":"Aggiungi e termina"}</button></div>`:""}
   </div>`;
  let filtered=null;
  const paintCrop=root=>{
    const cv=root.querySelector("#scCv");if(!cv)return;
    const maxW=cv.parentElement.clientWidth||340,maxH=Math.round(window.innerHeight*.62);
    scale=Math.min(maxW/src.width,maxH/src.height,1);cv.width=Math.round(src.width*scale);cv.height=Math.round(src.height*scale);cv.style.width=cv.width+"px";
    const x=cv.getContext("2d");x.drawImage(src,0,0,cv.width,cv.height);
    x.fillStyle="rgba(31,111,209,.18)";x.strokeStyle="#1f9bff";x.lineWidth=2;x.beginPath();quad.forEach(([a,b2],i)=>i?x.lineTo(a*scale,b2*scale):x.moveTo(a*scale,b2*scale));x.closePath();x.fill();x.stroke();
    quad.forEach(([a,b2],i)=>{x.beginPath();x.arc(a*scale,b2*scale,i===drag?14:11,0,7);x.fillStyle="rgba(255,255,255,.9)";x.fill();x.lineWidth=3;x.strokeStyle="#1f9bff";x.stroke()});
  };
  const paintRes=root=>{const cv=root.querySelector("#scRes");if(!cv||!res)return;filtered=filterCanvas(res,filter);cv.width=filtered.width;cv.height=filtered.height;cv.getContext("2d").drawImage(filtered,0,0)};
  const load=async(file,root)=>{
    if(!file)return;
    try{const img=await fileToImage(file);src=imgToCanvas(img,2400);URL.revokeObjectURL(img.src);quad=autoCorners(src)||insetQuad(src,.05);stage="crop";root._reb()}
    catch(e){toast("Impossibile leggere la foto")}
  };
  modal(draw(),"",function bind(root){
    const reb=()=>{root.innerHTML='<button class="x" data-close>×</button>'+draw();bind(root)};root._reb=reb;
    root.querySelector("#scCam").onchange=e=>load(e.target.files[0],root);
    root.querySelector("#scGal").onchange=e=>load(e.target.files[0],root);
    root.querySelectorAll("[data-scdel]").forEach(x=>x.onclick=()=>{pages.splice(+x.dataset.scdel,1);reb()});
    const dn=root.querySelector("#scDone");if(dn)dn.onclick=()=>{closeModal();opts.onDone(pages.slice())};
    if(stage==="crop"){
      const cv=root.querySelector("#scCv");requestAnimationFrame(()=>paintCrop(root));
      const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*(cv.width/r.width)/scale,(e.clientY-r.top)*(cv.height/r.height)/scale]};
      cv.onpointerdown=e=>{const p=pos(e);let bi=-1,bd=1e9;quad.forEach((q2,i)=>{const dd=Math.hypot(q2[0]-p[0],q2[1]-p[1])*scale;if(dd<bd){bd=dd;bi=i}});if(bd<45){drag=bi;cv.setPointerCapture(e.pointerId);e.preventDefault()}};
      cv.onpointermove=e=>{if(drag<0)return;const p=pos(e);quad[drag]=[Math.max(0,Math.min(src.width,p[0])),Math.max(0,Math.min(src.height,p[1]))];paintCrop(root)};
      cv.onpointerup=cv.onpointercancel=()=>{drag=-1;paintCrop(root)};
      root.querySelector("#scAuto").onclick=()=>{const q2=autoCorners(src);if(q2){quad=q2;paintCrop(root)}else toast("Bordi non trovati: sposta gli angoli a mano")};
      root.querySelector("#scAll").onclick=()=>{quad=insetQuad(src,0);paintCrop(root)};
      root.querySelector("#scCancel").onclick=()=>{stage="pick";src=null;reb()};
      root.querySelector("#scCrop").onclick=()=>{res=warpQuad(src,quad,2000);if(!res){toast("Angoli non validi");return}filter="doc";stage="filter";reb()};
    }
    if(stage==="filter"){
      requestAnimationFrame(()=>paintRes(root));
      root.querySelectorAll("[data-scf]").forEach(x=>x.onclick=()=>{filter=x.dataset.scf;reb()});
      root.querySelector("#scRot").onclick=()=>{res=rotateCanvas(res);reb()};
      root.querySelector("#scRecrop").onclick=()=>{stage="crop";reb()};
      const finish=more=>{const f=filtered||filterCanvas(res,filter);pages.push(f);src=null;res=null;filtered=null;stage="pick";
        if(opts.single||!more){closeModal();opts.onDone(pages.slice())}else reb()};
      root.querySelector("#scOk").onclick=()=>finish(false);
      const mo=root.querySelector("#scMore");if(mo)mo.onclick=()=>finish(true);
    }
  },true);
}
async function ensurePdfLib(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js")}catch(e){}
  return window.jspdf.jsPDF;
}
async function pagesPdf(photoRecs,filename){
  if(!DL){toast("Il download non è disponibile in questa vista");return}
  let jsPDF;try{jsPDF=await ensurePdfLib()}catch(e){toast("Impossibile caricare il generatore PDF");return}
  try{
    const doc=new jsPDF({unit:"mm",format:"a4"});let first=true;
    for(const p of photoRecs){const d=await imgData(p);if(!d)continue;const land=(p.w||1)>(p.h||1);
      if(!first)doc.addPage("a4",land?"l":"p");else if(land){doc.deletePage(1);doc.addPage("a4","l")}first=false;
      const PW=land?297:210,PH=land?210:297,M=6;const r=Math.min((PW-2*M)/(p.w||1),(PH-2*M)/(p.h||1));const w=(p.w||1)*r,h=(p.h||1)*r;
      doc.addImage(d,"JPEG",(PW-w)/2,(PH-h)/2,w,h)}
    if(first){toast("Nessuna pagina da esportare");return}
    if(await saveFile(filename,doc.output("blob")))toast("PDF pronto");
  }catch(e){toast("Errore PDF: "+(e&&e.message||e))}
}

let SAMPLE=null,SAMPLE_IMG=false;
function aiErr(e){const c=e&&e.code;

  else if(c==="images_unavailable"){SAMPLE_IMG=false;toast("Questa vista non può inviare immagini all'IA")}
  else toast("IA non disponibile: "+(e&&(e.message||c)||""));

Problemi annotati: ${r.problems||"(nessuno)"}`;
  const old=ta.value;btn.disabled=true;btn.textContent="✨ Scrivo…";
  try{const out=await SAMPLE(prompt,{cache:false,onText:({text})=>{ta.value=text}});

const ARTURL=location.origin+location.pathname;
function punchesOf(bid,date){return Object.entries(S.punches).filter(([,p])=>p.boardId===bid&&(!date||p.date===date)).map(([id,p])=>Object.assign({id},p)).sort((a,b2)=>a.at.localeCompare(b2.at))}
function pairsOf(bid,name){const l=punchesOf(bid).filter(p=>p.name===name);const out=[];let open=null;for(const p of l){if(p.type==="in"){if(!open)open=p}else if(open){out.push({inP:open,outP:p,h:(new Date(p.at)-new Date(open.at))/36e5,date:open.date});open=null}}return{pairs:out,open}}
function hoursOn(bid,name,date){const {pairs,open}=pairsOf(bid,name);return{h:pairs.filter(x=>x.date===date).reduce((s2,x)=>s2+x.h,0),open:open&&open.date<=date?open.at:null}}
function namesOnDate(bid,date){const all=punchesOf(bid);const n=new Set(all.filter(p=>p.date===date).map(p=>p.name));[...new Set(all.map(p=>p.name))].forEach(x=>{const {pairs,open}=pairsOf(bid,x);if(pairs.some(z=>z.date===date)||(open&&open.date<=date))n.add(x)});return[...n]}
function hoursFromPunches(list,name){let h=0,open=null;for(const p of list.filter(x=>x.name===name)){if(p.type==="in"){if(!open)open=p.at}else if(open){h+=(new Date(p.at)-new Date(open))/36e5;open=null}}return{h,open}}

function costData(b){
  const reps=boardReports(UI.boardId);let lab=0,eq=0,mat=0,hours=0;const missing=new Set(),byMonth={},byPerson={};
  reps.forEach(r=>{const m=(r.date||"").slice(0,7);byMonth[m]=byMonth[m]||{lab:0,eq:0,mat:0};
    if(r.mtype==="sal"){const sc=r.sec||{};(sc.manodopera||[]).forEach(w=>{const h=num(w.hours);if(!h)return;hours+=h;const p=personByName(w.name);const rate=num(w.rate)||num(p&&p.cost);if(!rate&&w.name)missing.add(w.name);const v=h*rate;lab+=v;byMonth[m].lab+=v;byPerson[w.name||"?"]=(byPerson[w.name||"?"]||0)+v});
      (sc.mezzi||[]).forEach(e=>{const v=num(e.hours)*num(e.rate);eq+=v;byMonth[m].eq+=v});(sc.materiali||[]).forEach(x=>{const v=num(x.qty)*num(x.price);mat+=v;byMonth[m].mat+=v})}
    (r.workers||[]).forEach(w=>{const h=num(w.hours)+num(w.ot);if(!h)return;hours+=h;const p=personByName(w.name);const rate=num(w.cost)||num(p&&p.cost);if(!rate&&w.name)missing.add(w.name);const v=h*rate;lab+=v;byMonth[m].lab+=v;byPerson[w.name||"?"]=(byPerson[w.name||"?"]||0)+v});
    (r.equipment||[]).forEach(e=>{const v=num(e.hours)*num(e.price)*(num(e.qty)||1);eq+=v;byMonth[m].eq+=v});

  return{lab,eq,mat,tot:lab+eq+mat,hours,missing:[...missing],byMonth,byPerson};

function salData(b){
  const cs=boardCards(UI.boardId).filter(c=>!c.template);const wf=(b.fields||[]).find(f=>f.type==="number"&&/ore/i.test(f.name));

  const cv=boardComputo(UI.boardId);const ct=cv.reduce((s2,v)=>s2+compTot(v)*num(v.price),0);

  return{perc:tw?dw/tw*100:0,weight:wf?wf.name:"numero di attività"};
}

/* ================= AUTOMAZIONI v2 ================= */
const RULE_TRIGGERS=[["moved","Quando una scheda viene spostata nella lista"],["created","Quando una scheda viene creata nella lista"],["checklistDone","Quando tutte le checklist sono completate"],["labelAdded","Quando viene aggiunta l'etichetta"],["overdue","Quando una scheda è scaduta (controllo all'apertura)"]];
const RULE_ACTIONS=[["complete","segna completata"],["uncomplete","segna non completata"],["label","aggiungi etichetta"],["removeLabel","togli etichetta"],["move","sposta nella lista"],["member","assegna a persona"],["setDue","imposta scadenza tra N giorni"],["safety","aggiungi checklist sicurezza"],["comment","aggiungi commento"],["archive","archivia"]];
function applyAction(b,card,a){
  const ln=id=>(listOf(b,id)||{}).name||"?";
  switch(a.type){
    case"complete":if(!card.done){card.done=true;card.completedAt=nowISO();if(card.due)card.dueDone=true;return"segnata completata"}break;
    case"uncomplete":if(card.done){card.done=false;card.completedAt=null;card.dueDone=false;return"riaperta"}break;
    case"label":if(a.label&&!(card.labels||[]).includes(a.label)){card.labels=(card.labels||[]).concat(a.label);return"etichetta aggiunta"}break;
    case"removeLabel":if(a.label&&(card.labels||[]).includes(a.label)){card.labels=card.labels.filter(x=>x!==a.label);return"etichetta tolta"}break;
    case"move":if(a.list&&card.listId!==a.list&&listOf(b,a.list)){card.listId=a.list;card.pos=listCards(card.boardId,a.list).reduce((m,z)=>Math.max(m,z.pos||0),0)+1;return"spostata in «"+ln(a.list)+"»"}break;
    case"member":if(a.member&&!(card.members||[]).includes(a.member)){card.members=(card.members||[]).concat(a.member);return"assegnata a "+a.member}break;
    case"setDue":{const d=new Date();d.setDate(d.getDate()+(parseInt(a.days)||0));const iso=isoOf(d);if(card.due!==iso){card.due=iso;card.dueDone=false;return"scadenza "+fmtD(iso)}break}
    case"safety":if(!(card.checklists||[]).some(c=>c.name==="Sicurezza")){card.checklists=(card.checklists||[]).concat({id:uid(),name:"Sicurezza",items:(b.safety||SAFETY_ITEMS).map(t=>({id:uid(),text:t,done:false}))});return"aggiunta checklist sicurezza"}break;
    case"comment":if(a.text){card.comments=(card.comments||[]);card.comments.unshift({id:uid(),by:null,at:nowISO(),text:String(a.text).replace("{data}",fmtD(todayISO())).replace("{scheda}",card.title)});return"commento aggiunto"}break;
    case"archive":if(!card.archived){card.archived=true;return"archiviata"}break;
  }
  return null;
}
function ruleActions(r){if(r.actions&&r.actions.length)return r.actions;if(r.when==="checklistDone"&&r.action==="move")return[{type:"move",list:r.list}];return[{type:r.action,label:r.label,list:r.list}]}
function runRules(b,card,ev,depth){
  depth=depth||0;if(depth>3)return false;let changed=false;
  for(const r of(b.rules||[])){
    let hit=false;
    if(r.when==="moved"&&ev.type==="moved"&&ev.to===r.list)hit=true;
    if(r.when==="created"&&ev.type==="created"&&(!r.list||ev.to===r.list))hit=true;
    if(r.when==="checklistDone"&&ev.type==="checklist"){const s=ckStats(card);hit=s.t>0&&s.t===s.d}
    if(r.when==="labelAdded"&&ev.type==="label"&&ev.label===r.label)hit=true;
    if(r.when==="overdue"&&ev.type==="overdue")hit=true;
    if(!hit)continue;
    const acts=r.when==="checklistDone"&&!r.actions?[{type:"move",list:r.list}]:ruleActions(r);
    for(const a of acts){const from=card.listId;const t=applyAction(b,card,a);if(t){addAct(card,"Automazione: "+t);changed=true;if(a.type==="move"&&card.listId!==from)runRules(b,card,{type:"moved",to:card.listId},depth+1);if(a.type==="label")runRules(b,card,{type:"label",label:a.label},depth+1)}}
  }
  return changed;
}
function ruleText(b,r){

  const acts=(r.when==="checklistDone"&&!r.actions)?[{type:"move",list:r.list}]:ruleActions(r);

function matchQuery(c,q){
  let toks=q.toLowerCase().match(/(?:[^\s"]+|"[^"]*")+/g)||[];const b=S.boards[c.boardId]||{};
  const names=[...new Set(Object.values(S.boards).flatMap(x=>(x.members||[]).concat((x.labels||[]).map(l=>l.name))))].map(x=>String(x).toLowerCase());
  const mg=[];for(let i=0;i<toks.length;i++){let t=toks[i];if(/^-?[@#]/.test(t)&&!t.includes('"')){while(i+1<toks.length&&names.some(n=>n.startsWith((t.replace(/^-?[@#]/,"")+" "+toks[i+1]))))t+=" "+toks[++i]}mg.push(t)}toks=mg;
  const hay=[c.title,c.desc,...(c.comments||[]).map(x=>x.text),...(c.checklists||[]).flatMap(cl=>(cl.items||[]).map(i=>i.text))].join(" ").toLowerCase();
  return toks.every(t0=>{let neg=false,t=t0;if(t.startsWith("-")&&t.length>1){neg=true;t=t.slice(1)}t=t.replace(/"/g,"");let ok;
    if(t.startsWith("@"))ok=(c.members||[]).some(m=>m.toLowerCase().includes(t.slice(1)));
    else if(t.startsWith("#"))ok=(c.labels||[]).some(id=>((labelOf(b,id)||{}).name||"").toLowerCase().includes(t.slice(1)));
    else if(t.startsWith("lista:"))ok=((listOf(b,c.listId)||{}).name||"").toLowerCase().includes(t.slice(6));
    else if(t.startsWith("cantiere:"))ok=(b.name||"").toLowerCase().includes(t.slice(9));
    else if(t==="is:open")ok=!c.done;else if(t==="is:done")ok=!!c.done;else if(t==="is:archived")ok=!!c.archived;
    else if(t==="due:overdue")ok=dueState(c)==="late";else if(/^due:\d+$/.test(t))ok=!!(c.due&&!c.done&&daysBetween(todayISO(),c.due.slice(0,10))<=+t.slice(4)&&daysBetween(todayISO(),c.due.slice(0,10))>=0);
    else if(t==="has:attachments")ok=!!c.hasAtt||Object.values(S.photos).some(p=>p.cardId===c.id)||(c.links||[]).length>0;
    else ok=hay.includes(t);
    return neg?!ok:ok});
}

async function importTrello(j){
  if(!j||!Array.isArray(j.lists)||!Array.isArray(j.cards))throw new Error("non è un'esportazione JSON di una bacheca Trello");
  const bid=uid();
  const lists=j.lists.slice().sort((a,b2)=>(a.pos||0)-(b2.pos||0)).map(l=>({id:"l"+l.id,name:l.name||"Lista",color:"",collapsed:false,archived:!!l.closed}));
  if(!lists.some(l=>!l.archived))lists.push({id:uid(),name:"Da fare",color:"",collapsed:false,archived:false});
  const labels=(j.labels||[]).map(l=>({id:"t"+l.id,name:l.name||({green:"Verde",yellow:"Giallo",orange:"Arancione",red:"Rosso",purple:"Viola",blue:"Blu"}[String(l.color).replace(/_.*$/,"")]||"Etichetta"),color:trelloColor(l.color)}));
  const memberName={};(j.members||[]).forEach(m=>memberName[m.id]=m.fullName||m.username||"Membro");
  const fields=(j.customFields||[]).map(f=>({id:"f"+f.id,name:f.name||"Campo",type:f.type==="number"?"number":f.type==="date"?"date":"text",_opts:Object.fromEntries((f.options||[]).map(o=>[o.id,(o.value&&o.value.text)||""])),_t:f.type}));
  const b={name:j.name||"Bacheca Trello",color:BOARD_COLORS[0],createdAt:nowISO(),createdBy:ME.id,archived:false,starred:false,imported:"trello",
    info:{cliente:"",indirizzo:"",committente:"",direttore:"",sicurezza:"",impresa:company().name||"",inizio:"",fine:""},
    lists,labels,fields:fields.map(({id,name,type})=>({id,name,type})),members:[...new Set(Object.values(memberName))],safety:SAFETY_ITEMS.slice(),rules:[]};
  if(j.desc)b.info.committente="";
  await put("boards",bid,b);
  const comments={};(j.actions||[]).filter(a=>a.type==="commentCard"&&a.data&&a.data.card).forEach(a=>{(comments[a.data.card.id]=comments[a.data.card.id]||[]).push({id:uid(),by:null,at:a.date||nowISO(),text:((a.memberCreator&&a.memberCreator.fullName)?a.memberCreator.fullName+": ":"")+(a.data.text||"")})});
  const cls={};(j.checklists||[]).forEach(c=>{(cls[c.idCard]=cls[c.idCard]||[]).push(c)});
  let n=0;
  for(const c of j.cards.slice().sort((a,b2)=>(a.pos||0)-(b2.pos||0))){
    const lid="l"+c.idList;const custom={};
    (c.customFieldItems||[]).forEach(it=>{const f=fields.find(x=>x.id==="f"+it.idCustomField);if(!f)return;let v="";
      if(it.idValue)v=f._opts[it.idValue]||"";else if(it.value){v=it.value.text!=null?it.value.text:it.value.number!=null?it.value.number:it.value.date?String(it.value.date).slice(0,10):it.value.checked!=null?(it.value.checked==="true"?"sì":"no"):""}
      custom[f.id]=String(v)});
    const card={boardId:bid,listId:lists.some(l=>l.id===lid)?lid:lists.find(l=>!l.archived).id,pos:++n,title:c.name||"Scheda",desc:c.desc||"",
      labels:(c.idLabels||[]).map(id=>"t"+id).filter(id=>labels.some(l=>l.id===id)),members:(c.idMembers||[]).map(id=>memberName[id]).filter(Boolean),
      checklists:(cls[c.id]||[]).sort((a,b2)=>(a.pos||0)-(b2.pos||0)).map(cl=>({id:uid(),name:cl.name||"Checklist",items:(cl.checkItems||[]).sort((a,b2)=>(a.pos||0)-(b2.pos||0)).map(it=>({id:uid(),text:it.name||"",done:it.state==="complete",who:it.idMember?memberName[it.idMember]||"":"",due:it.due?isoOf(new Date(it.due)):""}))})),
      comments:(comments[c.id]||[]).sort((a,b2)=>b2.at.localeCompare(a.at)),activity:[],custom,
      links:(c.attachments||[]).filter(a=>a.url&&/^https?:/i.test(a.url)).map(a=>({url:a.url,title:a.name||a.url})),
      due:c.due?isoOf(new Date(c.due)):"",start:c.start?isoOf(new Date(c.start)):"",dueDone:!!c.dueComplete,done:!!c.dueComplete,completedAt:c.dueComplete?(c.dateLastActivity||nowISO()):null,
      archived:!!c.closed,createdAt:nowISO(),createdBy:ME.id};
    if(card.links.length)card.hasAtt=true;
    addAct(card,"Importata da Trello");
    let js=JSON.stringify(card);if(js.length>240000){card.comments=card.comments.slice(0,20);card.desc=card.desc.slice(0,50000)}
    await put("cards",uid(),card);
  }
  return{name:b.name,lists:lists.filter(l=>!l.archived).length,cards:n};
}
async function loadPdfJs(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  return window.pdfjsLib;
}
async function pdfToCanvases(file,maxPages){
  const lib=await loadPdfJs();if(!lib)throw new Error("lettore PDF non disponibile");
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,maxPages||30);i++){const pg=await pdf.getPage(i);const vp0=pg.getViewport({scale:1});const sc=Math.min(2.2,1600/Math.max(vp0.width,vp0.height));const vp=pg.getViewport({scale:sc});
    const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;out.push(c)}
  return{pages:out,total:pdf.numPages};
}

async function importPeople(file){
  let rows;
  if(/\.csv$/i.test(file.name)){const t=await file.text();const sep=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",";
    rows=t.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim()).map(l=>{const out=[];let cur="",qq=false;for(const ch of l){if(ch==='"'){qq=!qq;continue}if(ch===sep&&!qq){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(x=>x.trim())})}
  else{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false}).map(r=>r.map(x=>String(x==null?"":x).trim()))}
  if(!rows||rows.length<2)throw new Error("file vuoto o senza righe di dati");
  const h=rows[0].map(x=>x.toLowerCase());const fi=re=>h.findIndex(x=>re.test(x));
  const iN=fi(/^nome|nominativo|dipendente|operaio/),iC=fi(/^cognome$/),iR=fi(/qualifica|mansione|ruolo/),iI=fi(/impresa|azienda|ditta/),iE=fi(/datore/),iK=fi(/costo|tariffa|€/),iT=fi(/telefono|cell/);
  if(iN<0)throw new Error("manca la colonna Nome");
  let added=0,updated=0;
  for(const r of rows.slice(1)){let name=(r[iN]||"").trim();if(iC>=0&&r[iC])name=(name+" "+r[iC]).trim();if(!name)continue;
    const ex=personByName(name);const p=ex?clone(S.people[ex.id]):{name,role:"",company:company().name||"",employer:company().name||"",cost:"",phone:"",photo:"",docs:[]};
    if(iR>=0&&r[iR])p.role=r[iR];if(iI>=0&&r[iI])p.company=r[iI];if(iE>=0&&r[iE])p.employer=r[iE];if(iK>=0&&r[iK])p.cost=String(num(r[iK]));if(iT>=0&&r[iT])p.phone=r[iT];
    await put("people",ex?ex.id:uid(),p);ex?updated++:added++}
  return{added,updated};
}
